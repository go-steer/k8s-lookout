# A sentinel that watches a LIST of namespaces instead of the whole
# cluster (#407) — by default one, its own. Use it INSTEAD of deploy/:
#
#   kubectl apply -k "github.com/go-steer/k8s-lookout/deploy-namespaced?ref=vX.Y.Z"
#
# This is the documented default for the namespace tier: namespaced Roles
# for everything namespaced, plus ONE small ClusterRole for reading nodes
# (and the PersistentVolumes topology-drift needs). With that grant every
# source keeps working except expiry and compute-class. For a sentinel with
# no cluster-wide grant at all, use deploy-namespaced-strict/ — thinner;
# README.md says exactly which sources survive each tier.
#
# To run it in a namespace other than agent-triage, build it from your own
# kustomization with `namespace: <yours>` — the watched namespace follows
# the pod's own through the downward API. To watch more namespaces, README.md
# shows the Role per namespace and the one flag to extend.
#
# It is deploy/ with these changes:
#   1. the cluster-wide ClusterRole and its binding are replaced by a Role +
#      RoleBinding in the watched namespace (role-watcher.yaml says which
#      rules of deploy/12 it carries) and the node-read ClusterRole;
#   2. the watcher gets --watch-scope=namespace and
#      --namespace=$(POD_NAMESPACE), so every namespaced informer lists and
#      watches that namespace only;
#   3. the kube-system capacity Role stays, as in deploy/.
#
# It lives beside deploy/ rather than under it because kustomize refuses an
# overlay nested inside the base it builds on. The `test` op pins the
# container, so a reordered base fails the build instead of patching the
# wrong one. Helm: rbac.scope=namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../deploy
  - role-watcher.yaml
  - rolebinding-watcher.yaml
  - clusterrole-watcher-nodes.yaml
  - clusterrolebinding-watcher-nodes.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: lookout-watch
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: lookout-watch
  - target:
      kind: Deployment
      name: lookout-watch
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: watcher
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --watch-scope=namespace
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --namespace=$(POD_NAMESPACE)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
