# The namespaced half of deploy/12-clusterrole-watcher.yaml, as a Role in
# each namespace the sentinel watches (--watch-scope=namespace, #407). This
# file is the one for the sentinel's own namespace; watching more means one
# copy per namespace (README.md shows how).
#
# Every rule here is a rule from deploy/12 on a namespaced resource, with
# the same verbs; read deploy/12 for why each one exists. What is left out,
# and why:
#   - cluster-scoped kinds (nodes and persistentvolumes come from
#     clusterrole-watcher-nodes.yaml instead; nodes/proxy,
#     storageclasses, ingressclasses, clusterroles, clusterrolebindings,
#     webhook configurations, ComputeClasses, ClusterLeewayPolicies): a
#     Role cannot grant them. The sources that need the rest are skipped at
#     startup, one log line each — see README.md;
#   - cert-manager Certificates and ACME Challenges/Orders: only the expiry
#     source reads them, and expiry cannot run here anyway, because its
#     webhook CA check needs the cluster-scoped webhook configurations.
#
# The `secrets: list` and `serviceaccounts: list` rules are kept, confined
# to this namespace. Their only reader in this tier is enrichment's
# reference checks (a pod naming a Secret or key that does not exist).
# Drop both and add --enrich-lists=all,-secrets,-serviceaccounts to the
# watcher if you would rather the sentinel not hold them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lookout-watch
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-watch
    app.kubernetes.io/component: watcher
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["leeway.lookout.go-steer.io"]
    resources: ["leewaypolicies"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["list", "watch"]
