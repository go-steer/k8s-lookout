# `web` — the bad-rollout victim, shaped exactly like the dev/drills/
# bad-deploy.md prescription: 2+ replicas, a readiness probe, a Service
# in front, and maxUnavailable=0 maxSurge=1. That strategy is the point:
# a bad rollout parks a crashing surge pod NEXT TO the healthy revision
# — users never see it, and only a Deployment-altitude signal
# (rollout.stall) notices in time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
