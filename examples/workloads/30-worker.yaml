# `worker` — victim for the crashloop scenario. A single replica with
# no Service: crashing it hurts nothing else, and reverting is a plain
# `kubectl apply` of this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - "import time\nwhile True: print('worker: tick', flush=True); time.sleep(30)"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
