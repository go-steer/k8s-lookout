# `api` — victim for image-pull and pdb-gridlock. The PDB allows
# exactly one disruption at the baseline 2 replicas; scaling to 1 drops
# disruptionsAllowed to 0, which is the objectstate.pdb_gridlocked
# transition the pdb-gridlock scenario drives.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8081"]
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
