# `vantage` — an in-cluster vantage point for user-visibility checks
# (the bad-rollout scenario proves the Service keeps answering 200
# while the stall is open, exactly as the bad-deploy drill prescribes).
apiVersion: v1
kind: Pod
metadata:
  name: vantage
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: vantage
    app.kubernetes.io/part-of: lookout-examples
spec:
  containers:
    - name: vantage
      image: python:3.12-alpine
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "import time; time.sleep(10**9)"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
