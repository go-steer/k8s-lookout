# Capture stub standing in for the core-agent daemon: the ~90-line
# python fake (dev/drills/stub-daemon.py) that implements the ONLY two
# endpoints the sentinel speaks (POST /sessions, POST /sessions/<sid>/
# inject) and logs every request body — `kubectl logs deploy/stub-daemon`
# is the wire-level evidence capture the scenario verify scripts grep.
#
# The Service is deliberately named `core-agent` on port 7777 so the
# shipped deploy/51 watcher manifest's --daemon-url works unmodified.
# examples/sentinel/up creates the `stub-daemon` ConfigMap from
# dev/drills/stub-daemon.py (single source of truth — the script is
# not duplicated here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-daemon
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: stub-daemon
    app.kubernetes.io/component: capture-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stub-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stub-daemon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: stub
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/stub-daemon.py", "7777"]
          ports:
            - name: http
              containerPort: 7777
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: script
          configMap:
            name: stub-daemon
---
apiVersion: v1
kind: Service
metadata:
  name: core-agent
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: stub-daemon
spec:
  selector:
    app.kubernetes.io/name: stub-daemon
  ports:
    - name: http
      port: 7777
      targetPort: http
