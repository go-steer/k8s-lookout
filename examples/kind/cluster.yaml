# kind cluster for the examples: control-plane + 2 workers. Two
# workers so the node-failure scenario can stop one worker while the
# sentinel + stub daemon (pinned to the other by examples/sentinel/up)
# keep running — the same shape as the M2 exit-check drill.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lookout-examples
nodes:
  - role: control-plane
  - role: worker
  - role: worker
