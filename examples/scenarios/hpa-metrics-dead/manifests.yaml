# An HPA targeting CPU utilization on a Deployment whose container has
# NO cpu request. Utilization is a percentage of the request, so with
# no request there is nothing to compute against: the HPA reports
# ScalingActive=False with reason FailedGetResourceMetric and stops
# scaling. Both objects stay Ready and healthy-looking.
#
# The MISSING cpu request is the fault, so it is the only dimension
# left unset. Memory is requested and limited normally: the kind nodes
# are capped at 8g of docker memory with --memory-swap pinned to match
# (cap_kind_nodes in lib.sh), and there the kernel kills the NODE
# container, not the pod — which would surface as a bogus
# objectstate.node_notready. Nothing here is allowed to be unbounded
# in the dimension that can take the node down.
#
# A cpu LIMIT is not an option either, tempting as it looks: with no
# cpu request set, admission defaults the request to the limit and the
# fault disappears. Bound cpu by keeping the workload idle instead.
#
# Applied by inject, deleted by revert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unscalable
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: unscalable
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unscalable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unscalable
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          resources:
            # No cpu request and no cpu limit — that is the fault.
            requests: { memory: "32Mi" }
            limits: { memory: "64Mi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unscalable
  namespace: lookout-demo
  labels:
    app.kubernetes.io/part-of: lookout-examples
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unscalable
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
