# A request no node can satisfy — the pod stays Pending/Unschedulable
# until revert deletes it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hog
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: hog
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hog
    spec:
      containers:
        - name: hog
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          resources:
            requests:
              cpu: "64"
              memory: "1Gi"
