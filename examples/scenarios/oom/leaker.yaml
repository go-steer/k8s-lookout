# dev/drills/memory-leaker.py at drill speed: +8 MiB every 2s against
# a 64Mi limit → OOMKilled in ~30s. The ConfigMap is created by inject
# from the drill script (single source of truth).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaker
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: leaker
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: leaker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leaker
    spec:
      containers:
        - name: leaker
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/memory-leaker.py", "8", "2"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: script
          configMap:
            name: memory-leaker
