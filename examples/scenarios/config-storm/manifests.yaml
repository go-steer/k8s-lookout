# Four unrelated-looking Deployments that share ONE ConfigMap. The
# blast radius is the config object, not a node and not an owner
# chain: nothing in the Kubernetes API connects consumer-a to
# consumer-d. Applied by inject, deleted by revert.
#
# Own namespace, not $DEMO_NS: breaking the mount also stalls four
# rollouts, and four rollout_stall incidents with no finer key in
# common form a NAMESPACE storm. That storm then swallows every later
# incident in the namespace until it clears. Confining it here keeps
# it off the demo app and off the next scenario.
#
# NO metadata.namespace anywhere in this file, deliberately. inject
# generates a fresh `lookout-storm-<epoch>` per run and applies with
# `-n`, which kubectl refuses to do against an explicit namespace. The
# name has to be new every time because the namespace-keyed storm
# above outlives the namespace: rollout_stall is never cleared when
# its Deployment is deleted (objectstate's onDeploymentDelete just
# drops the entry), so the storm sits open on the key
# `Namespace//lookout-storm` for the full 30m idle TTL — and a later
# run that recreates the same name attaches its FailedMounts to that
# stale storm instead of forming the ConfigMap one this scenario is
# about. Apply this file by hand with `kubectl apply -n <ns> -f`.
# See README § Why it owns a namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  labels:
    app.kubernetes.io/part-of: lookout-examples
data:
  app.conf: |
    mode=demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-a
  labels:
    app.kubernetes.io/name: consumer-a
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer-a
        app.kubernetes.io/component: config-consumer
    spec:
      # §7.5 ranks the node ABOVE the shared ConfigMap, so four
      # consumers that land on one node form a NODE storm and this
      # scenario silently stops testing the tier it is named for.
      # Spreading them means no node key can reach --storm-min (3) on
      # a two-worker cluster, and the ConfigMap is the first tier that
      # can form. DoNotSchedule rather than ScheduleAnyway: if the
      # spread cannot be honoured the pods stay Pending and inject
      # fails loudly, instead of verify timing out on a storm that
      # formed under the wrong key. See README § Why the spread is
      # load-bearing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Without this the tainted control-plane counts as a domain
          # holding zero consumers, so 2/1/0 is a skew of 2 and the
          # third pod never schedules. Honor drops domains the pod
          # cannot land on.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: config-consumer
      containers:
        - name: app
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          volumeMounts:
            - name: config
              mountPath: /etc/app
              readOnly: true
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
      volumes:
        - name: config
          configMap:
            name: shared-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-b
  labels:
    app.kubernetes.io/name: consumer-b
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer-b
  template:
