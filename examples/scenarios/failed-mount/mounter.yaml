# A Deployment whose pod mounts a ConfigMap that does not exist —
# applied by inject, deleted by revert. Never part of the baseline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mounter
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: mounter
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mounter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mounter
    spec:
      containers:
        - name: mounter
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          volumeMounts:
            - name: config
              mountPath: /etc/app
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: config
          configMap:
            name: missing-config
