# A pod whose readiness endpoint alternates 503/200 on a 20s cycle.
# With periodSeconds=2 and both thresholds at 1, the readiness gate
# flips every ~20s: four flips (degradation's FlapCount) in ~80s.
#
# Deliberately NO liveness probe. A flapping readiness gate never
# restarts the container and never sustains failure long enough for
# the reactive Unhealthy path — that silence is the whole point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flapper
  namespace: lookout-demo
  labels:
    app.kubernetes.io/name: flapper
    app.kubernetes.io/part-of: lookout-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flapper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flapper
    spec:
      containers:
        - name: flapper
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import http.server, time
              T0 = time.time()
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      ready = int((time.time() - T0) // 20) % 2 == 1
                      self.send_response(200 if ready else 503)
                      self.end_headers()
                      self.wfile.write(b"ready" if ready else b"not ready")
                  def log_message(self, *a):
                      pass
              http.server.HTTPServer(("", 8080), H).serve_forever()
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 1
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
