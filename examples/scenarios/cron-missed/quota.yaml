# The fault: the CronJob controller's Job creations start coming back
# Forbidden, so status.lastScheduleTime stops advancing. The CronJob
# object itself stays unsuspended and perfectly valid.
#
# Scoped to count/jobs.batch ONLY. A quota that covered cpu/memory
# would start rejecting the demo app's pods too and turn one clean
# fault into cluster-wide noise.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-jobs
  namespace: lookout-demo
  labels:
    app.kubernetes.io/part-of: lookout-examples
spec:
  hard:
    count/jobs.batch: "0"
