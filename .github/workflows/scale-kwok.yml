name: Scale (kwok)

# Read-path and soak scale regression guard on a padded kwok fleet:
#
#   - soak verdict self-test (`examples/kwok/soak --selftest`)
#   - read-path bench self-test (`examples/kwok/bench --selftest`)
#   - full cluster-wide read-path benchmark (`examples/kwok/bench`) with
#     default `--timeout` survival (`BENCH_REQUIRE_DEFAULT_TIMEOUT=1`) and
#     peak RSS ceiling (`BENCH_MAX_PEAK_MB=768`)
#
# Two tiers, matching e2e-kind.yml:
#
#   - push to main   → 100 fake nodes / ~1,000 pods (~15 min)
#   - weekly/manual  → 500 fake nodes / ~5,000 pods (~45 min)
#
# Placement/rank watch scale ladders moved with leeway to
# https://github.com/go-steer/leeway (#842).

on:
  schedule:
    - cron: '41 4 * * 2' # Tuesdays 04:41 UTC — a day off the e2e run
  workflow_dispatch:
    inputs:
      nodes:
        description: 'fake nodes (empty = 500)'
        required: false
        default: ''
      workloads:
        description: 'workloads (empty = 2000)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'pkg/kube/**'
      - 'pkg/checks/**'
      - 'internal/watch/**'
      - 'examples/kind/**'
      - 'examples/kwok/**'
      - 'examples/lib.sh'
      - '.github/workflows/scale-kwok.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: scale-kwok
  cancel-in-progress: false

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Soak verdict self-test
        run: examples/kwok/soak --selftest

      - name: Read-path bench self-test
        run: examples/kwok/bench --selftest

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.31.0

      - name: Cluster up
        run: examples/kind/up --no-demo-images

      - name: kwok up
        run: examples/kwok/up

      - name: Scale up
        env:
          TIER_NODES: ${{ inputs.nodes }}
          TIER_WORKLOADS: ${{ inputs.workloads }}
        run: |
          case "${{ github.event_name }}" in
            push) nodes=100; workloads=400 ;;
            *)    nodes=500; workloads=2000 ;;
          esac
          if [ -n "$TIER_NODES" ]; then
            case "$TIER_NODES" in
              ''|*[!0-9]*) echo "nodes must be a positive integer" >&2; exit 2 ;;
              *) nodes="$TIER_NODES" ;;
            esac
          fi
          if [ -n "$TIER_WORKLOADS" ]; then
            case "$TIER_WORKLOADS" in
              ''|*[!0-9]*) echo "workloads must be a positive integer" >&2; exit 2 ;;
              *) workloads="$TIER_WORKLOADS" ;;
            esac
          fi
          echo "tier: $nodes fake nodes, $workloads workloads"
          examples/kwok/scale-up "$nodes" "$workloads" 3

      - name: Read-path scale guard (bench)
        env:
          BENCH_REQUIRE_DEFAULT_TIMEOUT: '1'
          BENCH_MAX_PEAK_MB: '768'
        run: examples/kwok/bench

      - name: Collect forensics
        if: failure()
        run: |
          mkdir -p _forensics
          cp "${TMPDIR:-/tmp}/lookout-examples/bench.tsv" _forensics/ 2>/dev/null || true
          kubectl get nodes -o wide >_forensics/nodes.txt 2>&1 || true
          kubectl get pods -A -o wide >_forensics/pods.txt 2>&1 || true
          kubectl -n kube-system logs deploy/kwok-controller --tail=-1 >_forensics/kwok.log 2>&1 || true

      - name: Upload forensics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scale-forensics-${{ github.run_id }}
          path: _forensics/
          retention-days: 14

      - name: File or update tracking issue on unattended failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tier="${{ github.event_name }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --repo "${{ github.repository }}" \
            --state open --search 'kwok scale guard failed in:title' \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "Another failure ($tier tier, $(date -u +%Y-%m-%d), ${{ github.sha }}): $run_url"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "kwok scale guard failed ($tier tier): run ${{ github.run_id }}" \
              --body "The $tier-tier kwok scale guard failed on $(date -u +%Y-%m-%d) at ${{ github.sha }}. Run: $run_url — bench.tsv is in the scale-forensics artifact. The ceilings are in .github/workflows/scale-kwok.yml."
          fi
