name: Deploy demo

# Deploys a released lookout to the project's demo Gemini Enterprise
# endpoint: deploy-mcp-gemini/ at the release tag, the signed
# :<tag>-gke image (the provider build: caller-token Cloud API reads
# need it), and the endpoint's real values from the `demo` environment.
# Nothing deployment-specific lives in the repo.
#
# Runs after Release images succeeds for a tag (a release the workflow
# token creates starts no workflows, so `release: published` would
# never fire), or by hand for a redeploy or a config change. It never
# gates a PR and runs no tests: it ships a released artifact.
#
# One-time setup (Workload Identity Federation, the deploy service
# account, its namespace Role, the environment's variables):
# dev/deploy-demo/README.md. Unconfigured, the job is skipped.
on:
  workflow_run:
    workflows: ['Release images']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v0.37.0)'
        required: true
      image:
        description: 'Image to run instead of ghcr.io/go-steer/lookout:<tag>-gke, with the tag''s overlay (repo:tag or repo@sha256:...)'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy-demo:
    name: deploy-demo
    runs-on: ubuntu-latest
    # A Release images run for a tag that succeeded, or a manual run;
    # and only once the environment is configured.
    if: >-
      vars.DEMO_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    environment:
      name: demo
      url: https://${{ vars.DOMAIN }}/.well-known/oauth-protected-resource/mcp
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}

      # The same shape the Gemini Enterprise guide gives anyone setting
      # the values from their own kustomization: a configMapGenerator
      # merge plus the domain component, so DOMAIN reaches the route.
      - name: Write the deployment's kustomization
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          DOMAIN: ${{ vars.DOMAIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_ALLOW: ${{ vars.GOOGLE_ALLOW }}
          GOOGLE_ALLOW_WRITE: ${{ vars.GOOGLE_ALLOW_WRITE }}
          GOOGLE_GROUPS_SERVICE_ACCOUNT: ${{ vars.GOOGLE_GROUPS_SERVICE_ACCOUNT }}
          CLUSTERS_FROM: ${{ vars.CLUSTERS_FROM }}
          OAUTH_CUSTODY: ${{ vars.OAUTH_CUSTODY }}
          OAUTH_VAULT_AUTH_PROVIDER: ${{ vars.OAUTH_VAULT_AUTH_PROVIDER }}
          STATIC_IP_NAME: ${{ vars.STATIC_IP_NAME }}
          CERT_MAP: ${{ vars.CERT_MAP }}
        run: |
          for v in NAMESPACE DOMAIN GOOGLE_CLIENT_ID GOOGLE_ALLOW STATIC_IP_NAME CERT_MAP; do
            if [[ -z "${!v}" ]]; then
              echo "::error::environment variable $v is not set (dev/deploy-demo/README.md)"
              exit 1
            fi
            if [[ "${!v}" == *'"'* || "${!v}" == *$'\n'* ]]; then
              echo "::error::$v must not contain a quote or a newline"
              exit 1
            fi
          done
          for v in GOOGLE_ALLOW_WRITE GOOGLE_GROUPS_SERVICE_ACCOUNT CLUSTERS_FROM OAUTH_CUSTODY OAUTH_VAULT_AUTH_PROVIDER; do
            if [[ "${!v}" == *'"'* || "${!v}" == *$'\n'* ]]; then
              echo "::error::$v must not contain a quote or a newline"
              exit 1
            fi
          done
          # The release's provider image unless the run names another.
          image="${IMAGE:-ghcr.io/go-steer/lookout:${TAG}-gke}"
          if [[ "$image" == *'"'* || "$image" == *[[:space:]]* ]]; then
            echo "::error::image must not contain a quote or whitespace"
            exit 1
          fi
          if [[ "$image" == *@sha256:* ]]; then
            image_name="${image%@*}"
            image_ref="digest: \"${image#*@}\""
          elif [[ "${image##*/}" == *:* ]]; then
            image_name="${image%:*}"
            image_ref="newTag: \"${image##*:}\""
          else
            echo "::error::image needs a tag or a digest: $image"
            exit 1
          fi
          echo "image: $image"
          # v0.37.0 shipped the Gateway overlay as deploy-mcp-gemini-gateway/;
          # from v0.38.0 it is deploy-mcp-gemini/ itself.
          overlay=deploy-mcp-gemini
          [[ -f deploy-mcp-gemini/gateway.yaml ]] || overlay=deploy-mcp-gemini-gateway
          echo "overlay: $overlay"
          # OAUTH_CUSTODY set: generic MCP clients sign in too, through
          # lookout's own authorization server (the oauth component,
          # from v0.39.0). Its two Secrets live in the namespace.
          components="- ../deploy-mcp-gemini/domain"
          if [[ -n "$OAUTH_CUSTODY" ]]; then
            if [[ ! -f deploy-mcp-gemini/oauth/kustomization.yaml ]]; then
              echo "::error::OAUTH_CUSTODY is set but ${TAG} has no deploy-mcp-gemini/oauth component (v0.39.0 or later)"
              exit 1
            fi
            components="${components}"$'\n'"  - ../deploy-mcp-gemini/oauth"
            echo "sign-in for generic MCP clients: custody=${OAUTH_CUSTODY}"
          fi
          # GOOGLE_GROUPS_SERVICE_ACCOUNT set: group: entries in the
          # allow-lists are checked as it. An older overlay would drop it
          # and its binary refuse the group entries at startup.
          if [[ -n "$GOOGLE_GROUPS_SERVICE_ACCOUNT" ]]; then
            if ! grep -q -- '--google-groups-service-account=' deploy-mcp-gemini/mcp.yaml; then
              echo "::error::GOOGLE_GROUPS_SERVICE_ACCOUNT is set but ${TAG}'s overlay does not pass --google-groups-service-account"
              exit 1
            fi
            echo "group allow-list entries checked as ${GOOGLE_GROUPS_SERVICE_ACCOUNT}"
          fi
          mkdir .deploy-demo
          cat > .deploy-demo/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: "${NAMESPACE}"
          resources:
            - ../${overlay}
          components:
            ${components}
          images:
            - name: ghcr.io/go-steer/lookout
              newName: "${image_name}"
              ${image_ref}
          configMapGenerator:
            - name: lookout-mcp
              namespace: agent-triage
              behavior: merge
              literals:
                - "DOMAIN=${DOMAIN}"
                - "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
                - "GOOGLE_ALLOW=${GOOGLE_ALLOW}"
                - "GOOGLE_ALLOW_WRITE=${GOOGLE_ALLOW_WRITE}"
                - "GOOGLE_GROUPS_SERVICE_ACCOUNT=${GOOGLE_GROUPS_SERVICE_ACCOUNT}"
                - "CLUSTERS_FROM=${CLUSTERS_FROM}"
                - "OAUTH_CUSTODY=${OAUTH_CUSTODY}"
                - "OAUTH_VAULT_AUTH_PROVIDER=${OAUTH_VAULT_AUTH_PROVIDER}"
          patches:
            - target: {kind: Gateway, name: lookout-mcp}
              patch: |-
                - op: replace
                  path: /metadata/annotations/networking.gke.io~1certmap
                  value: "${CERT_MAP}"
                - op: replace
                  path: /spec/addresses/0/value
                  value: "${STATIC_IP_NAME}"
          EOF
          kubectl kustomize .deploy-demo > .deploy-demo/rendered.yaml
          grep -E '^kind:|image:|hostnames' -A1 .deploy-demo/rendered.yaml

      # Probes the endpoint every ~2 s from before the apply until the old
      # pods have finished draining, and fails the run on any answer but
      # 200: a deploy that dropped requests is a failed deploy, even if
      # the endpoint is healthy by the time the smoke test looks. (The
      # first deploy, with nothing serving yet, has nothing to drop.)
      # Server-side apply: a client-side apply re-sends the HTTPRoute's
      # rules list, which the API server has defaulted, and so reports
      # it changed on every run.
      - name: Apply
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          url="https://${DOMAIN}/.well-known/oauth-protected-resource/mcp"
          before="$(curl -s -m 5 -o /dev/null -w '%{http_code}' "$url" || true)"
          probe() {
            while :; do
              printf '%s %s\n' "$(date -u +%T)" "$(curl -s -m 5 -o /dev/null -w '%{http_code}' "$url" || true)"
              sleep 2
            done
          }
          probe > /tmp/probe.log &
          probe_pid=$!

          kubectl apply --server-side --force-conflicts --field-manager=lookout-deploy-demo \
            -f .deploy-demo/rendered.yaml
          kubectl -n "$NAMESPACE" rollout status deploy/lookout-mcp --timeout=5m
          # rollout status returns once the new pods are ready; the old
          # ones still serve through their 30 s preStop sleep, and the
          # load balancer takes a while to stop routing to them.
          sleep 75
          kill "$probe_pid"

          echo "endpoint during the rollout (status, consecutive probes):"
          awk '{print $2}' /tmp/probe.log | uniq -c | awk '{print "  " $2 " x" $1}'
          failed="$(grep -cv ' 200$' /tmp/probe.log || true)"
          if [[ "$before" != 200 ]]; then
            echo "endpoint answered $before before the apply: a first deploy, nothing to drop"
          elif [[ "$failed" -gt 0 ]]; then
            echo "::error::the endpoint failed $failed of $(wc -l < /tmp/probe.log) probes during the rollout"
            grep -v ' 200$' /tmp/probe.log | head -20
            exit 1
          fi

      # The two answers Gemini Enterprise depends on: the RFC 9728
      # metadata naming this resource, and a 401 for a call without a
      # token. Retried for a first deploy, which waits on the load
      # balancer; after a clean rollout it answers at once.
      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          url="https://${DOMAIN}"
          for i in $(seq 1 30); do
            code="$(curl -s -m 10 -o /tmp/meta.json -w '%{http_code}' "$url/.well-known/oauth-protected-resource/mcp" || true)"
            [[ "$code" == 200 ]] && break
            sleep 10
          done
          if [[ "$code" != 200 ]]; then
            echo "::error::metadata answered $code, not 200"
            exit 1
          fi
          if ! grep -qF "\"resource\":\"$url/mcp\"" /tmp/meta.json; then
            echo "::error::metadata does not name $url/mcp"
            cat /tmp/meta.json
            exit 1
          fi
          code="$(curl -s -m 10 -o /dev/null -w '%{http_code}' -X POST "$url/mcp")"
          if [[ "$code" != 401 ]]; then
            echo "::error::POST /mcp without a token answered $code, not 401"
            exit 1
          fi
          echo "metadata 200 for $url/mcp; POST /mcp without a token 401"
