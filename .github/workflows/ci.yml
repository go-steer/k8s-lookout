name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Docs — the parallel ci-docs.yml emits matching green stubs
      # so required checks stay satisfied.
      - '**/*.md'
      # Image-build config — no Go code touched; release-images.yml
      # rebuilds on its own trigger.
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release*.yml'
      - '.github/workflows/docs*.yml'
      # Docs-site sources — the Astro/Starlight build lives in
      # docs.yml; generated reference pages are guarded by the
      # internal/sitedoc drift test whenever Go changes.
      - 'docs/site/**'
      # License / config-only chores that can't affect Go.
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release*.yml'
      - '.github/workflows/docs*.yml'
      - 'docs/site/**'
      - 'LICENSE'

# Cancel in-progress runs when a new commit lands on the same branch
# so we don't queue stale tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job below is a thin wrapper over a script under
# dev/ci/presubmits/. The same script is what `dev/tools/ci` runs
# locally, so a green local run is the same green run as remote CI.
# Keep the wiring boring — logic lives in dev/tools/, not in YAML.
#
# Every setup-go below reads `go-version-file: go.mod` rather than a
# version literal. That is load-bearing, not tidiness: this file used
# to pin `go-version: '1.26'` with check-latest, which resolves to
# whatever the newest 1.26.x is on the runner that day. So CI ran a
# different toolchain from both the local runner and the release
# image (which builds from the go.mod version — see
# release-images.yml), and the vuln job silently passed on stdlib
# advisories that a release build was still shipping. go.mod is now
# the single source of truth for all three.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - run: go mod download
      - name: Vet
        run: dev/ci/presubmits/vet
      - name: Build
        # Builds every provider build-tag variant (none / gke /
        # allproviders) — see dev/tools/build.
        run: dev/ci/presubmits/build
      - name: Test
        run: dev/ci/presubmits/test-unit
      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      # No cache for ~/.cache/golangci-lint: cached analyzer results
      # have produced findings a fresh local run couldn't reproduce
      # (see core-agent's ci.yml for the full story). Deterministic
      # results are worth more than the ~45s savings.
      - name: Format
        run: dev/ci/presubmits/verify-go-format
      - name: golangci-lint
        run: dev/ci/presubmits/lint-go

  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tidy
        run: dev/ci/presubmits/verify-mod-tidy
      - name: Verify version fallback
        # Needs tags: the check compares internal/version's -dev
        # fallback against the latest release tag (#146).
        run: |
          git fetch --tags --force origin
          dev/ci/presubmits/verify-version-fallback

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vuln scan
        run: dev/ci/presubmits/verify-vuln

  # Not named `deploy`: that name is already taken by the docs-site
  # publish job in docs.yml, and two jobs with one name make the
  # required-check list ambiguous.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kustomize, if the runner image stops shipping it
        run: |
          set -euo pipefail
          if command -v kustomize >/dev/null 2>&1; then
            kustomize version
            exit 0
          fi
          cd /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | sudo bash
      - name: Chart matches deploy/*.yaml
        # HELM_PARITY_REQUIRE=1 turns the tool-missing skip into a
        # failure. Without it, a runner image that dropped kustomize
        # would leave this job green while checking nothing, which is
        # the exact failure this job exists to prevent.
        env:
          HELM_PARITY_REQUIRE: '1'
        run: dev/ci/presubmits/verify-helm-parity
