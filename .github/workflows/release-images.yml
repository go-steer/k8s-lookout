name: Release images

# Builds + publishes the multi-arch (amd64 + arm64) container image
#
#   ghcr.io/go-steer/lookout — the `lookout` multicall binary;
#   ENTRYPOINT is `lookout watch` for drop-in compatibility with
#   ghcr.io/go-steer/k8s-event-watcher deployments (see Dockerfile).
#
# on every `v*.*.*` tag push. Structure mirrors core-agent's
# release-images.yml (metadata-action tag pyramid, buildx + QEMU,
# Sigstore keyless signing) minus the variant matrix — one repo,
# one binary, TWO image flavors:
#
#   :<v>       — the default, GCP-FREE build (DESIGN.md §2: no cloud
#                SDK linked; the nm-based conformance test pins it).
#                `--sources=…,quota` in it refuses loudly at startup.
#   :<v>-gke   — the same binary built with `-tags allproviders`
#                (+ :latest-gke), for project-tier quota deployments
#                (§11 Project tier / §10.2). M4 drill observation 5:
#                without a published flavor every quota deployment
#                had to build its own image. Same Dockerfile, same
#                signing — only BUILD_TAGS differs.
#
# The two flavors are a SINGLE job driven by a `flavor` matrix
# (`build-and-push`): the build + push + sign + verify pipeline is
# identical, so only the per-flavor knobs (BUILD_TAGS, tag suffix,
# :latest tag, OCI title/description) live in `strategy.matrix`.
# fail-fast is off so a break in one flavor doesn't cancel the other
# mid-publish.
#
# Images are signed via Sigstore keyless (GitHub Actions OIDC →
# Fulcio short-lived cert). Verify with:
#
#   cosign verify ghcr.io/go-steer/lookout:vX.Y.Z \
#     --certificate-identity-regexp '^https://github.com/go-steer/k8s-lookout' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# That exact invocation runs post-publish (the "Verify published
# signatures + smoke test" step below) against EVERY tag this job
# pushes, for BOTH flavors — the workflow no longer trusts that a
# `cosign sign` exit-0 means consumers can actually verify what's on
# the registry, and the previously-unchecked `-gke` tag→digest
# linkage is now asserted on every release.
#
# Manual republish (e.g. for a tag pushed before this workflow
# existed): use the workflow_dispatch entrypoint with the tag input.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Empty = use the current ref.'
        required: false

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # cosign keyless via GitHub OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: lookout

jobs:
  build-and-push:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-24.04

    strategy:
      # Publish both flavors independently — if one fails to build or
      # verify, let the other finish rather than cancelling a
      # half-published release.
      fail-fast: false
      matrix:
        include:
          # The default, GCP-free flavor: bare tags, plain :latest,
          # empty BUILD_TAGS.
          - flavor: default
            job_name: lookout
            build_tags: ''
            tag_suffix: ''
            latest_tag: latest
            oci_title: lookout
            oci_description: 'k8s-lookout: deterministic Kubernetes/GKE reads for agent-driven troubleshooting, plus the resident per-cluster sentinel (lookout watch, the former k8s-event-watcher).'
          # The GKE flavor (M4 drill observation 5): identical
          # pipeline, one extra build-arg (BUILD_TAGS=allproviders →
          # the gke cloud provider links in), every tag suffixed
          # -gke. latest_tag is spelled out as latest-gke (never a
          # bare :latest) so this leg can NEVER shadow the GCP-free
          # default.
          - flavor: gke
            job_name: lookout-gke
            build_tags: allproviders
            tag_suffix: -gke
            latest_tag: latest-gke
            oci_title: lookout (gke)
            oci_description: 'k8s-lookout built with -tags allproviders: the gke cloud provider linked in for project-tier quota/capacity deployments (the default :<version> image is GCP-free by design).'

    steps:
      - uses: actions/checkout@v4

      # #146 guard: deploy/51's image pin must be the version being
      # released — it sat at v0.1.0 for eleven releases because
      # nothing tied cutting a release to the manifest. A stale pin
      # fails the release BEFORE anything publishes.
      - name: Verify deploy manifest pin matches the tag
        if: github.ref_type == 'tag'
        run: |
          PINNED=$(grep -oE 'image: ghcr.io/go-steer/lookout:v[0-9]+\.[0-9]+\.[0-9]+' deploy/51-deployment-watcher.yaml | head -1 | sed 's/.*lookout://')
          if [[ "$PINNED" != "${{ github.ref_name }}" ]]; then
            echo "::error::deploy/51-deployment-watcher.yaml pins ${PINNED} but the release tag is ${{ github.ref_name }} — bump the pin in the release-cut commit (docs/release-process.md)" >&2
            exit 1
          fi
          echo "deploy/51 pin matches ${{ github.ref_name }}"

      # Extract Go version from go.mod so the build container always
      # tracks the project's pinned version. Bumping go.mod
      # automatically bumps the build image — no second-source-of-
      # truth that can drift.
      - name: Extract Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(grep -E '^go [0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod | awk '{print $2}')
          if [[ -z "$GO_VERSION" ]]; then
            echo "::error::Could not extract Go version from go.mod" >&2
            exit 1
          fi
          echo "version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building against Go ${GO_VERSION}"

      # QEMU enables building linux/arm64 images on the linux/amd64
      # runner. Without this, buildx --platform fails for non-native
      # architectures.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action computes the full tag matrix from a
      # declarative spec. On a released `v0.1.0` push the default
      # flavor produces:
      #   :v0.1.0  :0.1.0  :0.1  :0  :latest
      # On a pre-release `v0.2.0-rc.1` push it produces:
      #   :v0.2.0-rc.1  :0.2.0-rc.1
      #   (no floating short-tags: docker/metadata-action's semver
      #    handler skips :{{major}}.{{minor}} and :{{major}} for
      #    pre-releases; we skip :latest via the enable-guard below.)
      # On workflow_dispatch with tag input: uses that input verbatim.
      #
      # The `-gke` flavor produces the same shape with every entry
      # suffixed via `suffix=${{ matrix.tag_suffix }}` (empty for the
      # default flavor) and latest_tag spelled out per-flavor
      # (latest / latest-gke) so the -gke leg can never publish a
      # bare :latest.
      #
      # {{raw}} (the git-tag-verbatim `:vX.Y.Z` form) is published in
      # ADDITION to core-agent's stripped-`v` pyramid because the
      # deploy/ manifests pin the git-tag form — one obvious mapping
      # from a release tag to the image it produced.
      - name: Compute image tags + labels + annotations
        id: meta
        uses: docker/metadata-action@v5
        env:
          # For MULTI-ARCH images, GHCR pulls its package-page
          # description from manifest INDEX annotations, not from
          # per-image LABELs. Setting DOCKER_METADATA_ANNOTATIONS_LEVELS
          # tells metadata-action to also emit annotations for the
          # index level (the multi-arch fat manifest) — not just for
          # each per-platform child manifest. Without this, GHCR's
          # page description stays blank on multi-arch even when the
          # OCI label is set correctly.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          # latest=false kills metadata-action's implicit latest=auto,
          # which adds a BARE :latest on any non-prerelease semver tag
          # in BOTH matrix legs — the -gke leg would (and in v0.11.0
          # did) overwrite the GCP-free :latest with the gke digest,
          # breaking the README's ":latest = default flavor" contract
          # and failing the default leg's signature verify (it resolved
          # :latest to the other leg's not-yet-signed digest). The
          # explicit type=raw entries below are the ONLY source of
          # :latest / :latest-gke.
          flavor: |
            latest=false
          tags: |
            # Semver tag → git-tag form + full pyramid of floating tags
            type=semver,pattern={{raw}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.tag_suffix }}
            # Released semver tags get :latest (:latest-gke) — pre-release
            # tags (v0.2.0-rc.1 / v0.2.0-dev.1 / etc.) do NOT, so an RC
            # doesn't accidentally become the tag consumers pull by
            # default. Semver's convention: any tag containing a `-`
            # is a pre-release.
            type=raw,value=${{ matrix.latest_tag }},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            # Manual dispatch with tag input
            type=raw,value=${{ inputs.tag }}${{ matrix.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          # OCI image LABELS — baked into each per-platform image
          # config blob. Consumed by OCI-aware tooling (registries
          # other than GHCR, image inspectors).
          labels: |
            org.opencontainers.image.title=${{ matrix.oci_title }}
            org.opencontainers.image.description=${{ matrix.oci_description }}
            org.opencontainers.image.vendor=go-steer
          # OCI ANNOTATIONS — attached to the manifest / index.
          # GHCR renders its package-page description from the index
          # annotation on multi-arch images (labels alone don't
          # populate the GHCR page). Keep this list in sync with
          # `labels:` above.
          annotations: |
            org.opencontainers.image.title=${{ matrix.oci_title }}
            org.opencontainers.image.description=${{ matrix.oci_description }}
            org.opencontainers.image.vendor=go-steer

      # Compute the build version: the tag if we're on one, else the
      # dispatch input. Threaded into the binary via -ldflags so
      # `lookout version` reports the real identity.
      - name: Compute build version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Build date for the internal/version stamp (#146) — one value
      # per job so both flavors of one release report the same
      # timestamp.
      - name: Resolve build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build + push multi-arch image. type=gha cache speeds up
      # iterative builds substantially — the Go module download +
      # dependency compile is the slow part and it caches cleanly
      # across builds with the same go.mod/go.sum. BUILD_TAGS is empty
      # for the default flavor (GCP-free) and `allproviders` for -gke.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
            BUILD_TAGS=${{ matrix.build_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore keyless signing — uses the GitHub Actions OIDC
      # token to mint a short-lived cert from Fulcio, signs the
      # image manifest with that, records signature in Rekor
      # (transparency log). No long-lived signing keys to manage.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign by digest, not by tag — tags can move; digests are
          # immutable. cosign signs once and the signature covers
          # every tag that points at the same digest.
          echo "$TAGS" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      # Post-publish verification — the gap #111 flagged. Signing
      # exiting 0 does NOT prove a consumer can verify what's on the
      # registry, nor that each published tag actually resolves to the
      # signed digest (the `-gke` linkage was never checked). This
      # step runs the exact `cosign verify` invocation documented in
      # the header against EVERY tag pushed, then pulls the image by
      # its immutable digest and smoke-runs the binary. It runs once
      # per flavor via the matrix, so BOTH flavors are verified.
      - name: Verify published signatures + smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # Verify each published tag's signature. Verifying BY TAG
          # (not by digest) also asserts the tag→digest linkage: a tag
          # that didn't land, or points at an unsigned digest, fails
          # here. This is what closes the unchecked `-gke` linkage.
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "▸ verifying signature: ${tag}"
            cosign verify "${tag}" \
              --certificate-identity-regexp '^https://github.com/go-steer/k8s-lookout' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
          done <<< "$TAGS"

          # Smoke test: pull by the immutable digest and run the
          # binary. The image ENTRYPOINT is ["/lookout", "watch"], so
          # override it to exercise `lookout version` — proves the
          # published artifact is a runnable lookout binary, not just
          # a signed blob. (Pulls the amd64 child of the multi-arch
          # index on this runner.)
          SMOKE_IMG="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}@${DIGEST}"
          echo "▸ smoke: docker run --entrypoint /lookout ${SMOKE_IMG} version"
          docker run --rm --entrypoint /lookout "${SMOKE_IMG}" version

          # Confirm the drop-in ENTRYPOINT is intact — existing
          # k8s-event-watcher deployments rely on ["/lookout","watch"]
          # (their `args:` are bare watch flags). A regression here
          # would silently break every such deployment on upgrade.
          ENTRYPOINT=$(docker inspect --format '{{json .Config.Entrypoint}}' "${SMOKE_IMG}")
          echo "▸ entrypoint: ${ENTRYPOINT}"
          if [[ "${ENTRYPOINT}" != '["/lookout","watch"]' ]]; then
            echo "::error::unexpected entrypoint ${ENTRYPOINT} (want [\"/lookout\",\"watch\"])" >&2
            exit 1
          fi

  # Post-publish flavor-divergence guard (#144): on v0.11.0 both
  # matrix legs implicitly claimed :latest (metadata-action's
  # latest=auto) and the gke leg won the race — :latest served the
  # GCP provider build, the opposite of the documented default. #142
  # fixed the tagging; this job makes a recurrence fail the release:
  # the floating tags must diverge from each other and each must
  # equal its version tag.
  verify-flavor-divergence:
    if: github.ref_type == 'tag'
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Assert latest/-gke digests diverge and match their version tags
        run: |
          set -euo pipefail
          dig() {
            docker buildx imagetools inspect "ghcr.io/go-steer/lookout:$1" --format '{{json .Manifest.Digest}}'
          }
          LATEST=$(dig latest); LATEST_GKE=$(dig latest-gke)
          VER=$(dig "${{ github.ref_name }}"); VER_GKE=$(dig "${{ github.ref_name }}-gke")
          echo "latest=${LATEST} latest-gke=${LATEST_GKE}"
          echo "${{ github.ref_name }}=${VER} ${{ github.ref_name }}-gke=${VER_GKE}"
          [[ "$LATEST" == "$LATEST_GKE" ]] && { echo "::error::latest and latest-gke share a digest — a flavor leg claimed the wrong floating tag (#144)"; exit 1; }
          [[ "$LATEST" != "$VER" ]] && { echo "::error::latest does not match ${{ github.ref_name }}"; exit 1; }
          [[ "$LATEST_GKE" != "$VER_GKE" ]] && { echo "::error::latest-gke does not match ${{ github.ref_name }}-gke"; exit 1; }
          echo "flavor tags verified: divergent floating tags, each matching its version"

  # GitHub Release object (#146, core-agent's discoverability model):
  # every release tag gets a Release whose body is the CHANGELOG
  # section plus the image/cosign footer, composed by
  # dev/release/compose-release-notes.sh. Runs after both flavors
  # verified so a Release never points at a half-published registry
  # state.
  github-release:
    if: github.ref_type == 'tag'
    needs: [build-and-push, verify-flavor-divergence]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compose notes and create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./dev/release/compose-release-notes.sh "${{ github.ref_name }}" /tmp/notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/notes.md \
            --verify-tag
