# Green stubs for docs-only / image-config-only changes: ci.yml skips
# those paths, but the branch-protection required checks (test, lint,
# tidy, vuln) must still report success or the PR can never merge.
# Job names here MUST match ci.yml exactly.

name: CI (non-Go)

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release*.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release*.yml'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "non-Go change — no Go to test"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "non-Go change — no Go to lint"

  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - run: echo "non-Go change — go.mod untouched"

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - run: echo "non-Go change — no Go to scan"
