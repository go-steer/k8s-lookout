name: Feature or new check
description: Something lookout should be able to do and cannot
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        For a *new check* specifically, the first two fields below are the
        whole review — a check is one sentence that has to be true,
        actionable, and silent on a healthy cluster.
        [`docs/adding-a-check.md`](https://github.com/go-steer/k8s-lookout/blob/main/docs/adding-a-check.md)
        explains why, and is also what you would follow to send it as a
        PR instead.

  - type: textarea
    id: claim
    attributes:
      label: The claim, in one sentence
      description: >-
        What would lookout assert? "A StatefulSet whose
        `serviceName` names a Service that does not exist will never get
        stable network identities for its pods."
    validations:
      required: true

  - type: textarea
    id: action
    attributes:
      label: What does someone do about it
      description: >-
        A finding that does not imply a next step is noise with a
        severity attached.
    validations:
      required: true

  - type: textarea
    id: silence
    attributes:
      label: When is it silent
      description: >-
        On a normally-configured cluster, how often does this fire? And
        is there a legitimate configuration that resembles the defect and
        must be excluded?

  - type: dropdown
    id: claim_type
    attributes:
      label: Incident or posture
      description: >-
        An **incident** is broken now and clears itself when fixed — it
        belongs in a bare `lookout scan`. A **posture** claim is "healthy,
        but with no safety net"; it never self-clears, so it belongs in
        the opt-in `audit` group.
      options:
        - incident
        - posture
        - not sure
    validations:
      required: true

  - type: input
    id: prior_art
    attributes:
      label: Prior art
      description: >-
        Does another tool detect this — k8sgpt, Popeye, kube-score,
        Polaris? A pointer to the analyzer is genuinely useful, including
        for working out where their version is wrong.
