# The capture stub from examples/sentinel, with three soak changes:
#   - it runs on the control plane, which churn never drains or pauses;
#   - serve.py serves the stub's handler on a threaded server, so no inject
#     is lost to a blocked keep-alive connection;
#   - it tees a timestamped copy of the wire to a hostPath that kind mounts
#     from $SOAK_DIR/wire, so the wire log survives pod restarts and
#     container log rotation and can be read straight off the host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-daemon
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: stub-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stub-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stub-daemon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: stub
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python -u /app/serve.py /app/stub-daemon.py 7777 2>&1 | python -u /app/stamp.py | tee -a /wire/wire.log
          ports:
            - name: http
              containerPort: 7777
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: wire
              mountPath: /wire
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: script
          configMap:
            name: stub-daemon
        - name: wire
          hostPath:
            path: /fp-wire
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: core-agent
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: stub-daemon
spec:
  selector:
    app.kubernetes.io/name: stub-daemon
  ports:
    - name: http
      port: 7777
      targetPort: http
