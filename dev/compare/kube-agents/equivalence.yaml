  note: lookout reports failed pods/jobs live; TTL-less Job spec is not a posture finding
idle-namespace:
  kinds: []
  claim: gap
underrequest:
  kinds: [top.saturation]
  claim: partial
unsized-workload:
  kinds: [top.unrequested_container]
  lookout_names: pods
  claim: covered
idle-workload:
  kinds: [edge.endpoints_missing, edge.selector_empty]
