# kube-agents check slug -> lookout finding kinds that answer the same
# question. crosswalk.py joins the two sides' findings on this map, per
# (cluster, namespace, object).
#
#   kinds      lookout `kind=` values that count as the same finding
#   reasons    optional: only these `reason=` values count (else any)
#   claim      the pre-run expectation from the 2026-10-18 source review:
#              covered | partial | gap | intentional | out-of-scope
#              -- the live run grades this, it does not trust it
#   match      how objects are joined: object (default) | namespace |
#              cluster | project | none
#   note       why, briefly
#
# Objects: a kube-agents candidate names `object` as `Kind/name` in
# `namespace`; a lookout record names `kind_of_object`, `name`,
# `namespace`. Cluster-scoped checks (`match: cluster`) join on the
# cluster alone, since the two sides name the cluster differently
# (gcloud's `<project>/<location>/<name>` vs the kubeconfig context).

# ---------------------------------------------------------------- obtainability
no-requests:
  kinds: [top.unrequested_container]
  lookout_names: pods
  claim: covered
  note: surfaced per pod by `triage top --show-unrequested` (needs metrics.k8s.io), not by `audit workloads`; joined on the owner name
no-memory-limit:
  kinds: [top.unlimited_container]
  lookout_names: pods
  claim: covered
  note: surfaced per pod by `triage top --show-unlimited` (needs metrics.k8s.io); joined on the owner name
no-pdb:
  kinds: [audit.no_pdb]
  claim: covered
blocking-pdb:
  kinds: [drain.pdb_gridlock, pdb.gridlocked]
  claim: covered
  note: "`stab drain` and `triage delta`; kube-agents names the PDB, lookout may name the PDB or the workload"
no-hpa:
  kinds: []
  claim: intentional
  note: flagging every fixed-size service is noise; lookout validates HPAs that exist
hpa-cannot-scale:
  kinds: [audit.hpa_cannot_scale]
  reasons: [HPAMinEqualsMax, HPATargetMissingRequests, HPATargetMissing]
  claim: covered
rigid-scheduling:
  kinds: [audit.rigid_scheduling]
  claim: covered
no-spread:
  kinds: [audit.no_spread]
  claim: covered
probes-readiness:
  kinds: [audit.no_readiness_probe]
  claim: covered
probes-liveness:
  kinds: [audit.no_liveness_probe]
  claim: covered
single-replica:
  kinds: [audit.single_replica, drain.singleton]
  claim: covered
schedule-never-succeeds:
  kinds: [cron.missed, job.failed, audit.rigid_scheduling]
  claim: partial
  note: kube-agents reads lastScheduleTime vs lastSuccessfulTime on the CronJob; lookout sees missed schedules and failed Jobs live
rollout-drops-traffic:
  kinds: []
  claim: gap
  note: static maxUnavailable-vs-replicas check; lookout watches live rollouts instead
strategy-causes-downtime:
  kinds: []
  claim: gap
  note: Deployment strategy Recreate
cronjob-runs-overlap:
  kinds: []
  claim: gap
  note: concurrencyPolicy Allow
service-selects-nothing:
  kinds: [edge.selector_empty, edge.endpoints_missing]
  claim: covered
service-port-unresolved:
  kinds: [edge.backend_missing, route.backend_port]
  claim: covered
liveness-preempts-readiness:
  kinds: []
  claim: gap
spread-not-achieved:
  kinds: [leeway.contract_violated, leeway.placement_drift, leeway.baseline_breach]
  claim: covered
  note: "`leeway report`"
prestop-outlives-grace:
  kinds: []
  claim: gap
rwo-claim-contended:
  kinds: [volume.multi_attach, volume.zone_conflict]
  claim: covered
hpa-floors-at-one:
  kinds: []
  claim: gap
pdb-overlapping:
  kinds: []
  claim: gap
untargeted-compute-class-workload:
  kinds: [leeway.rank_unknown, compute.fallback_sustained]
  claim: partial
  note: lookout tracks ComputeClass placement/fallback, not the static nodeSelector omission

# ------------------------------------------------------------------- compliance
privileged-container:
  kinds: [audit.privileged_container]
  claim: covered
host-namespace:
  kinds: [audit.host_namespace]
  claim: covered
hostpath-mount:
  kinds: [audit.hostpath_mount]
  claim: covered
cluster-admin-binding:
  kinds: [audit.cluster_admin_binding]
  claim: covered
wildcard-rbac:
  kinds: [audit.wildcard_rbac]
  claim: covered
netpol-missing:
  kinds: [audit.netpol_missing, audit.netpol_absent, audit.netpol_selects_nothing]
  match: namespace
  claim: covered
default-sa-automount:
  kinds: [audit.default_sa_automount]
  objects_from: mounting_workload_names
  claim: covered
  note: lookout names the ServiceAccount and lists the mounting workloads in a field; collect.py names each workload
workload-identity-off:
  kinds: [audit.workload_identity_off]
  match: cluster
  claim: covered
legacy-metadata:
  kinds: [audit.legacy_metadata, audit.workload_identity_off]
  reasons: [LegacyMetadataEndpoints, NodePoolMetadataServerOff, WorkloadIdentityDisabled]
  match: cluster
  claim: covered
  note: collect.py 2.9 reads workloadMetadataConfig.mode per node pool (empty = legacy metadata reachable); lookout reports the same condition as the cluster's Workload Identity being off
public-control-plane:
  kinds: [audit.public_control_plane]
  match: cluster
  claim: covered
podsecurity-gaps:
  kinds: [audit.podsecurity_gaps]
  match: namespace
  claim: partial
  note: different question in the same place — collect.py grades each workload's containers against the restricted profile (runAsNonRoot, seccompProfile, allowPrivilegeEscalation, capabilities.drop); lookout grades the namespace's PSA enforce label. Joined on namespace, so a match means both flagged the namespace, not the same fact
kcc-object-wedged:
  kinds: []
  claim: gap
  note: Config Connector CRs with Ready=False
image-floating-tag:
  kinds: []
  claim: gap
unbound-sa-automount:
  kinds: []
  claim: gap
  note: lookout checks the default SA only
lb-world-open:
  kinds: []
  claim: gap
anonymous-rbac-binding:
  kinds: []
  claim: gap
  note: lookout's rbac audit does not single out system:anonymous / system:unauthenticated subjects (they surface only if bound to cluster-admin or a wildcard role)

