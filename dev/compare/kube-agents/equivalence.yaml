  claim: out-of-scope
  note: Artifact Registry policy, not a cluster question

# ------------------------------------------------- consistency drift (weekly)
# Every facet is a GKE control-plane / node-pool setting read through
# `gcloud container clusters describe`. lookout reads the same object via
# pkg/cloud and emits per-cluster posture findings for the facets that
# are security-relevant; the *cohort outlier* judgement (is this cluster
# different from its peers?) is a fleet-level join lookout leaves to the
# fleet layer by design. The facets below are graded on whether lookout
# surfaces the underlying setting at all.
release-channel:
  kinds: [audit.upgrade_unmanaged]
  reasons: [NoReleaseChannel]
  match: cluster
  claim: partial
shielded-nodes:
  kinds: []
  match: cluster
  claim: gap
secure-boot:
  kinds: []
  match: cluster
  claim: gap
integrity-monitoring:
  kinds: []
  match: cluster
  claim: gap
network-policy:
  kinds: [audit.netpol_missing, audit.netpol_absent]
  match: cluster
  claim: partial
  note: lookout audits policies present; it does not read the GKE enforcement flag / Dataplane V2 setting
private-nodes:
  kinds: []
  match: cluster
  claim: gap
private-endpoint:
  kinds: [audit.public_control_plane]
  match: cluster
  claim: covered
authorized-networks:
  kinds: [audit.public_control_plane]
  reasons: [AuthorizedNetworksAllowAll, AuthorizedNetworksAllowProviderCIDRs, PublicEndpointUnrestricted]
  match: cluster
  claim: covered
logging-components:
  kinds: []
  match: cluster
  claim: gap
monitoring-components:
  kinds: []
  match: cluster
  claim: gap
managed-prometheus:
  kinds: []
  match: cluster
  claim: gap
binary-authorization:
  kinds: []
  match: cluster
  claim: gap
node-autoprovisioning:
  kinds: [audit.nodepool_cannot_grow]
  match: cluster
  claim: partial
pool-autoscaling:
  kinds: [audit.nodepool_cannot_grow]
  reasons: [AutoscalingMaxZero]
  match: cluster
  claim: partial
intra-node-visibility:
  kinds: []
  match: cluster
  claim: gap
datapath-provider:
  kinds: []
  match: cluster
  claim: gap
label-keys:
  kinds: []
  match: none
  claim: out-of-scope
  note: fleet cohort labelling convention
image-type:
  kinds: [audit.upgrade_unmanaged, audit.version_behind]
  reasons: [StaleNodeImageType]
  match: cluster
  claim: partial
database-encryption:
  kinds: []
  match: cluster
  claim: gap
no-environment-label:
  kinds: []
  match: none
  claim: out-of-scope

