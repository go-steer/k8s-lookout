# What the Deploy demo workflow may do, in the demo namespace only:
# apply deploy-mcp-gemini's objects and watch the rollout.
# No delete (the workflow does not prune) and nothing cluster-scoped;
# setup.sh creates the namespace once. DEPLOY_SA is replaced by
# setup.sh with the deploy service account's email, which is how GKE
# names a Google service account to Kubernetes RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lookout-demo-deploy
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  # rollout status reads the Deployment's ReplicaSets and pods.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.gke.io]
    resources: [healthcheckpolicies, gcpbackendpolicies]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lookout-demo-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lookout-demo-deploy
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: DEPLOY_SA
