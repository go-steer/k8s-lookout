# Template for the two Multi-Attach pods; ./up fills __NODE__ / __ROLE__.
# Pinned by nodeSelector, not nodeName: standard-rwo binds on first
# consumer, which needs the scheduler to pick the node.
apiVersion: v1
kind: Pod
metadata:
  name: ma-__ROLE__
  namespace: uat-volumes
  labels: {app: ma, role: __ROLE__}
spec:
  nodeSelector: {kubernetes.io/hostname: __NODE__}
  containers:
  - name: app
    image: registry.k8s.io/pause:3.9
    volumeMounts: [{name: data, mountPath: /data}]
    resources: {requests: {cpu: 10m, memory: 16Mi}}
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: ma-claim}
