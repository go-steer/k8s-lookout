# stab drift --identity fixture (#179). Applied client-side by ./up,
# then patched by a second field manager (rogue-operator); the audit
# trail must name the principal behind that write.
apiVersion: v1
kind: Namespace
metadata:
  name: uat-drift
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifty
  namespace: uat-drift
spec:
  replicas: 1
  selector: {matchLabels: {app: drifty}}
  template:
    metadata: {labels: {app: drifty}}
    spec:
      containers:
      - {name: app, image: registry.k8s.io/pause:3.9, resources: {requests: {cpu: 10m, memory: 16Mi}}}
