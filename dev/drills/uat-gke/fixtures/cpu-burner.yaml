# triage top --history fixture (#179): a container pinned near its CPU
# limit, so Cloud Monitoring has a window worth summarizing.
apiVersion: v1
kind: Namespace
metadata:
  name: uat-top
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burner
  namespace: uat-top
spec:
  replicas: 1
  selector: {matchLabels: {app: burner}}
  template:
    metadata: {labels: {app: burner}}
    spec:
      containers:
      - name: burn
        image: busybox:1.36
        command: ["sh", "-c", "while :; do :; done"]
        resources:
          requests: {cpu: 100m, memory: 16Mi}
          limits: {cpu: 200m, memory: 32Mi}
