# The AX Task every incident runs as (--ax-task-template). The ax sink
# sets metadata.name per task and changes nothing else; the template is
# decoded strictly at startup, so a typo fails `lookout watch` at once.
#
# Replace the image with your agent's (it must serve core-agent's
# session API, POST /sessions and /sessions/<sid>/inject, on http.port),
# and the egress rules with what it needs to reach.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  atespace: default
spec:
  image: REGISTRY/AGENT-IMAGE@sha256:REPLACE-ME
  http:
    port: 8484
  idle:
    suspendAfter: 10m
