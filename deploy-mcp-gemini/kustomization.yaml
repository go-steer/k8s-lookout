# lookout mcp for a Gemini Enterprise app (#699): every tool call reads
# as the person who made it, with their own Google token, so what they
# see is what their own Kubernetes RBAC and Cloud IAM allow. Standalone:
# use it beside deploy/ (or without it), not on top of it.
#
#   kubectl apply -k "github.com/go-steer/k8s-lookout/deploy-mcp-gemini?ref=vX.Y.Z"
#
# Edit config.yaml first (domain, OAuth client ID, allow-lists), or patch
# it from your own kustomization. The full walk-through, from OAuth client
# to the Gemini Enterprise data store, is the "Gemini Enterprise" page of
# the docs site.
#
# What it creates in agent-triage:
#   - ServiceAccount lookout-mcp, with NO RBAC and no Workload Identity:
#     lookout's own identity reads nothing.
#   - Deployment lookout-mcp: two stateless replicas of
#     `lookout mcp --google-client-id ...` on :8383, the triage and
#     audit tool profiles plus six incident reads, minus findings diff
#     (it needs a store), the access log on stdout.
#   - Service, BackendConfig, ManagedCertificate and Ingress: a GKE
#     external HTTPS load balancer on the reserved global static IP
#     lookout-mcp-ip, with a Google-managed certificate for DOMAIN.
#
# To serve behind a Gateway with a Certificate Manager map rather than an
# Ingress, apply deploy-mcp-gemini-gateway/: it builds on this one and
# takes the same config.yaml.
#
# Not included: the sentinel store. Store-backed tools (triage status,
# history via --at) need --store on a file this pod can read; with the
# sentinel's store on a ReadWriteOnce volume, that means running lookout
# mcp in the sentinel's pod instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - mcp.yaml

# DOMAIN, set once in config.yaml, is also the certificate's domain and
# the Ingress host (domain/).
components:
  - domain
