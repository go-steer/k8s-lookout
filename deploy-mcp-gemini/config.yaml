# The one file to edit. Every value here is a placeholder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
data:
  # The hostname Gemini Enterprise reaches lookout at. Its DNS A record
  # must point at the static IP named in gateway.yaml (lookout-mcp-ip),
  # and the certificate map there must cover it. It also becomes the
  # HTTPRoute's hostname (the domain component) and --resource-url
  # (https://<DOMAIN>/mcp).
  DOMAIN: lookout.example.com
  # The OAuth client the Gemini Enterprise data store is configured with
  # (Web application, redirect URI
  # https://vertexaisearch.cloud.google.com/oauth-redirect).
  GOOGLE_CLIENT_ID: 123456789012-replace-me.apps.googleusercontent.com
  # Who may call lookout: comma-separated emails, @domain for every
  # account of that Google Workspace domain, or group:<group email> for
  # every member of a Google group (needs GOOGLE_GROUPS_SERVICE_ACCOUNT).
  GOOGLE_ALLOW: "@example.com"
  # Who may call tools that change state (triage status, findings
  # diff/ack), same syntax. Empty: no one.
  GOOGLE_ALLOW_WRITE: ""
  # Only with group: entries above: the service account their
  # membership is checked as (it holds the Groups Reader admin role;
  # lookout-mcp's principal needs roles/iam.serviceAccountTokenCreator
  # on it), e.g. lookout-groups@<project>.iam.gserviceaccount.com.
  # Empty: no group entries.
  GOOGLE_GROUPS_SERVICE_ACCOUNT: ""
  # Serve many clusters instead of the one lookout runs in (#700):
  # comma-separated scopes, mixable — a project or project/location,
  # fleet:<host-project>, folders/<id>, organizations/<id>. Each caller
  # sees, and can name, only the clusters they can read: discovery runs
  # with their own token. Every tool then takes a cluster argument, and
  # k8s_list_clusters lists the names. Empty: the cluster lookout runs in.
  CLUSTERS_FROM: ""
  # Read only with the optional oauth component (generic MCP clients
  # sign in through lookout's own authorization server): who holds each
  # person's Google grant, vault or sealed, and for vault the Agent
  # Identity auth provider, projects/<p>/locations/<l>/authProviders/<n>.
  OAUTH_CUSTODY: ""
  OAUTH_VAULT_AUTH_PROVIDER: ""
