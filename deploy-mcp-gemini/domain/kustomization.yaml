# DOMAIN, set once in config.yaml, is also the certificate's domain, the
# Ingress host and the HTTPRoute hostname; whichever of them the build
# has. A replacement resolves where it runs, so a kustomization that
# patches the ConfigMap from outside must list this component itself,
# or those copies keep the DOMAIN it was built with:
#
#   components:
#     - github.com/go-steer/k8s-lookout/deploy-mcp-gemini/domain?ref=vX.Y.Z
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: ConfigMap
      name: lookout-mcp
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: ManagedCertificate
          name: lookout-mcp
        fieldPaths:
          - spec.domains.0
      - select:
          kind: Ingress
          name: lookout-mcp
        fieldPaths:
          - spec.rules.0.host
      - select:
          kind: HTTPRoute
          name: lookout-mcp
        fieldPaths:
          - spec.hostnames.0
