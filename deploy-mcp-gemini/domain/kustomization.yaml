# DOMAIN, set once in config.yaml, is also the HTTPRoute's hostname. A
# replacement resolves where it runs, so a kustomization that sets the
# ConfigMap from outside must list this component itself (and set the
# values with a configMapGenerator merge, which lands before components
# run; a patch lands after), or the route keeps the DOMAIN the overlay
# was built with:
#
#   components:
#     - github.com/go-steer/k8s-lookout/deploy-mcp-gemini/domain?ref=vX.Y.Z
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: ConfigMap
      name: lookout-mcp
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: lookout-mcp
        fieldPaths:
          - spec.hostnames.0
