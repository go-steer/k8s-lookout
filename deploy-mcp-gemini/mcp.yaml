# lookout mcp in Google-token mode behind a GKE external HTTPS load
# balancer, for a Gemini Enterprise app (see kustomization.yaml).

# No RBAC is bound to this ServiceAccount, on purpose, and it needs no
# Workload Identity: every read runs with the calling person's own Google
# token. The token is still mounted, because the in-cluster client config
# (API server address and CA) is read from it; it authenticates nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
spec:
  # Stateless HTTP: any replica answers any request.
  replicas: 2
  # A rollout must not leave the load balancer without a serving pod:
  # bring the new one up and let it settle before an old one goes.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 15
  selector:
    matchLabels:
      app.kubernetes.io/name: lookout-mcp
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lookout-mcp
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: lookout-mcp
      # Covers the preStop sleep plus the server's 5 s drain.
      terminationGracePeriodSeconds: 45
      # One replica per zone. Behind a Gateway the load balancer reaches a
      # zone only once the controller attaches that zone's NEG, minutes
      # after the first pod lands there, and GKE's readiness gate calls a
      # pod in a not-yet-attached NEG ready. Two zones means losing one,
      # or the node under one replica, never empties the backend. Per
      # revision (pod-template-hash), so a rollout's new pods are not
      # pushed toward the emptiest zone, which is the one most likely to
      # have no NEG yet.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lookout-mcp
              app.kubernetes.io/component: mcp
          matchLabelKeys:
            - pod-template-hash
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # The -gke flavor: the cloud checks call Google Cloud APIs with
          # the caller's token, and only the provider build links them.
          # The GCP-free :vX.Y.Z answers them read.unavailable. Another
          # image or registry: an `images:` entry in your kustomization.
          image: ghcr.io/go-steer/lookout:v0.37.0-gke
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: lookout-mcp
          # The image's ENTRYPOINT is `lookout watch`; this one is `lookout mcp`.
          command: ["/lookout", "mcp"]
          args:
            - "--listen=0.0.0.0:8383"
            - "--allow-non-loopback"
            # One line per tool call, with the caller's email, to stdout
            # and so to Cloud Logging. Never the token or the payload.
            - "--access-log=/dev/stdout"
            - "--google-client-id=$(GOOGLE_CLIENT_ID)"
            - "--google-allow=$(GOOGLE_ALLOW)"
            - "--google-allow-write=$(GOOGLE_ALLOW_WRITE)"
            - "--resource-url=https://$(DOMAIN)/mcp"
            # The triage and audit profiles plus the incident reads a chat
            # user asks for (health, changes, events, spec, radius, top), not
            # everything: every advertised tool costs schema tokens on every
            # model call. Widen with --tools if callers need more. findings
            # diff is left out: it needs --report and --store, which this
            # overlay does not provide.
            - "--profile=triage"
            - "--tools=audit,k8s_cluster_health,k8s_recent_changes,k8s_event_timeline,k8s_resource_spec,k8s_blast_radius,k8s_resource_top,-k8s_findings_diff"
          ports:
            - name: mcp
              containerPort: 8383
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # The RFC 9728 metadata is the one unauthenticated 200 this
          # server answers.
          readinessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource/mcp
              port: mcp
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource/mcp
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
          # lookout closes its listener on SIGTERM, but the load balancer
          # keeps sending a terminating pod requests until it is out of the
          # backend group, tens of seconds later; without this every
          # rollout answered 503 for up to a minute and a half. The sleep
          # action, not an exec: the image has no shell or sleep binary
          # (needs Kubernetes 1.30+).
          lifecycle:
            preStop:
              sleep:
                seconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
  # No cloud.google.com/neg annotation: the Gateway controller writes and
  # owns it (and rewrites any other value, zones pre-provisioning
  # included). The health check and timeout are in gateway.yaml.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 80
      targetPort: mcp
      protocol: TCP
