# lookout mcp in Google-token mode behind a GKE external HTTPS load
# balancer, for a Gemini Enterprise app (see kustomization.yaml).

# No RBAC is bound to this ServiceAccount, on purpose, and it needs no
# Workload Identity: every read runs with the calling person's own Google
# token. The token is still mounted, because the in-cluster client config
# (API server address and CA) is read from it; it authenticates nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
spec:
  # Stateless HTTP: any replica answers any request.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lookout-mcp
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lookout-mcp
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: lookout-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/go-steer/lookout:v0.36.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: lookout-mcp
          # The image's ENTRYPOINT is `lookout watch`; this one is `lookout mcp`.
          command: ["/lookout", "mcp"]
          args:
            - "--listen=0.0.0.0:8383"
            - "--allow-non-loopback"
            # One line per tool call, with the caller's email, to stdout
            # and so to Cloud Logging. Never the token or the payload.
            - "--access-log=/dev/stdout"
            - "--google-client-id=$(GOOGLE_CLIENT_ID)"
            - "--google-allow=$(GOOGLE_ALLOW)"
            - "--google-allow-write=$(GOOGLE_ALLOW_WRITE)"
            - "--resource-url=https://$(DOMAIN)/mcp"
            # The triage and audit profiles, not everything: every advertised
            # tool costs schema tokens on every model call. Widen with --tools
            # if callers need more. findings diff is left out: it needs
            # --report and --store, which this overlay does not provide.
            - "--profile=triage"
            - "--tools=audit,-k8s_findings_diff"
          ports:
            - name: mcp
              containerPort: 8383
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # The RFC 9728 metadata is the one unauthenticated 200 this
          # server answers.
          readinessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource/mcp
              port: mcp
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource/mcp
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "lookout-mcp"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 80
      targetPort: mcp
      protocol: TCP
---
# The load balancer's health check targets the metadata path too (the
# default, GET /, is a 404 here), and its backend timeout covers long
# tool calls (scan's default --timeout is minutes, not seconds).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: lookout-mcp
  namespace: agent-triage
spec:
  timeoutSec: 300
  healthCheck:
    type: HTTP
    requestPath: /.well-known/oauth-protected-resource/mcp
    port: 8383
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: lookout-mcp
  namespace: agent-triage
spec:
  domains:
    - lookout.example.com # replaced with DOMAIN from config.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lookout-mcp
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-mcp
    app.kubernetes.io/component: mcp
  annotations:
    kubernetes.io/ingress.class: gce
    # Reserve it first: gcloud compute addresses create lookout-mcp-ip --global
    kubernetes.io/ingress.global-static-ip-name: lookout-mcp-ip
    networking.gke.io/managed-certificates: lookout-mcp
    # HTTPS only: Gemini Enterprise sends each person's Google token.
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: lookout.example.com # replaced with DOMAIN from config.yaml
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lookout-mcp
                port:
                  name: http
