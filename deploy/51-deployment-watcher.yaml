# The sentinel Deployment (`lookout watch`, the former
# k8s-event-watcher sidecar). Watches Kubernetes Events via the local
# kube-apiserver, filters + dedupes, and POSTs matched events to the
# core-agent daemon's session inject endpoint.
#
# This started as core-agent's 51-deployment-watcher.yaml with ONE
# change: the image line. The ghcr.io/go-steer/lookout image's
# ENTRYPOINT is ["/lookout", "watch"], so the bare-flag `args:` below
# splice in behind `watch` exactly as they spliced in behind the old
# k8s-event-watcher binary — an existing deployment swaps images with
# zero other config change (M0 exit criterion, DESIGN.md §14). That
# image-swap path still holds; NEW deployments from this manifest
# additionally get the full capability surface EXPLICITLY: every
# portable source plus token-burn pinned in `args:` (explicit lists
# make a missing grant a loud startup FAILURE, §11 — the right
# posture when this manifest's RBAC is applied alongside), storm
# correlation on, and the occurrence store on a volume. Note the
# binary's own defaults are `--sources=auto --storm=auto`
# (probe-and-enable: misses are skipped with a loud line instead of
# failing) — a manifest that pins nothing still gets everything the
# deployment's RBAC supports.
#
# Runs as a SEPARATE Deployment from the daemon (not a sidecar
# container in the daemon's pod) so:
#   - operators can scale the two independently
#   - a sentinel restart doesn't restart the daemon (and vice-versa)
#   - additional sentinels in remote clusters follow the same shape
#     (this manifest is the template — copy + change --cluster-name +
#     --daemon-url to add coverage of another cluster)
#
# Talks to the local daemon via the core-agent Service on port 7777.
# For remote clusters, override --daemon-url to
# https://<external-daemon-endpoint>:7777.
#
# IMAGE FLAVORS (M4 drill observation 5): the default
# ghcr.io/go-steer/lookout:<version> image is GCP-FREE by design
# (DESIGN.md §2 — no cloud SDK linked; conformance-tested), so
# `--sources=…,quota` in it REFUSES at startup, loudly and correctly,
# and the capacity source runs without the provider scale-decision
# sub-source. Project-tier deployments (§11: the ONE sentinel per GCP
# project that enables the quota source, §10.2) must pin the
# `-tags allproviders` flavor instead:
#
#   image: ghcr.io/go-steer/lookout:<version>-gke   # or :latest-gke
#
# Same binary, same flags, same signing (cosign verify works
# identically); only the compiled-in cloud provider differs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-event-watcher
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: k8s-event-watcher
    app.kubernetes.io/component: watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-event-watcher
      app.kubernetes.io/component: watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-event-watcher
        app.kubernetes.io/component: watcher
    spec:
      serviceAccountName: k8s-event-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: watcher
          image: ghcr.io/go-steer/lookout:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--daemon-url=http://core-agent.agent-triage.svc.cluster.local:7777"
            - "--token-env=WATCHER_TOKEN"
            - "--mode=per-incident"
            - "--owner=sre-oncall@example.com"
            - "--cluster-name=local"
            - "--dedup-window=5m"
            - "--in-cluster"
            - "--metrics-addr=:9090"
            - "--log-level=info"
            # Full capability surface, pinned explicitly (§11: a named
            # source's missing grant is a loud startup error — this
            # manifest ships with the matching RBAC in deploy/12-15).
            # The seven portable sources plus token-burn (its cost
            # stack is the --daemon-url daemon right above); quota
            # stays off — it is the per-GCP-project opt-in that also
            # needs the -gke image flavor (see IMAGE FLAVORS).
            - "--sources=k8s-events,object-state,rollout,saturation,degradation,expiry,capacity,token-burn"
            - "--storm=on"
            # Occurrence store (§9.1): info-signal persistence, graph
            # history (--at post-mortems), triage-status records.
            - "--store=/var/lib/lookout/lookout.db"
          volumeMounts:
            - name: lookout-data
              mountPath: /var/lib/lookout
          env:
            - name: WATCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-event-watcher-token
                  key: token
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # The occurrence store's home. emptyDir is the zero-friction
        # default: the store is telemetry, never control flow, so
        # losing it on pod reschedule costs history, not correctness.
        # For durable post-mortems (--at queries across restarts,
        # `triage changes`), swap in the PVC below — the image is
        # distroless (no tar), so `kubectl cp` off a live pod does NOT
        # work; a PVC you can mount from a debug pod is the practical
        # way to copy the store out.
        - name: lookout-data
          emptyDir: {}
        # PVC alternative (create the claim first):
        # - name: lookout-data
        #   persistentVolumeClaim:
        #     claimName: lookout-data
