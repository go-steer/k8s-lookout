# Something to scrape (#288). Until now deploy/ shipped no Service at
# all: deploy/16's NetworkPolicy admits a same-namespace scraper on
# :9090 and the assumption was that it reaches the pod IP directly.
# That works for a hand-rolled Prometheus with a pod-level scrape
# config and for nothing else — every operator-managed monitoring
# stack discovers targets through a Service.
#
# ClusterIP, not headless: with replicas: 1 there is exactly one
# endpoint either way, and a normal ClusterIP is what a ServiceMonitor
# and a manual `kubectl port-forward svc/lookout-watch-metrics 9090`
# both expect. It publishes the metrics port only — the sentinel
# serves nothing else, and /metrics is an incident-topology map, which
# is why deploy/16 still gates who may reach it.
apiVersion: v1
kind: Service
metadata:
  name: lookout-watch-metrics
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-watch
    app.kubernetes.io/component: watcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lookout-watch
    app.kubernetes.io/component: watcher
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
