apiVersion: v2
name: lookout
description: >-
  The k8s-lookout sentinel — a resident per-cluster watcher that turns
  leading indicators into agent incident sessions.
type: application

# The chart version deliberately tracks the app version rather than
# moving on its own. Two independent version lines would mean answering
# "which chart ships v0.23.0?" from a compatibility matrix nobody
# maintains; one line means the answer is the version itself. It costs
# a no-change chart release each cut, which is cheap.
#
# dev/tools/verify-helm-parity enforces both halves of that: version ==
# appVersion without the leading v, and appVersion == the image pin in
# deploy/51-deployment-watcher.yaml. A cut that bumps one and forgets
# the others fails before it can publish a chart that installs the
# previous release.
version: 0.23.0
appVersion: "v0.23.0"

kubeVersion: ">=1.25.0-0"
home: https://go-steer.github.io/k8s-lookout/
sources:
  - https://github.com/go-steer/k8s-lookout
keywords:
  - kubernetes
  - diagnostics
  - sre
  - incident-response
  - observability
maintainers:
  - name: go-steer
    url: https://github.com/go-steer
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
