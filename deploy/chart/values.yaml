# Defaults here are not "sensible-looking values someone picked for the
# chart". They are the values in deploy/*.yaml, and
# dev/tools/verify-helm-parity fails if that stops being true:
#
#   helm template lookout-watch deploy/chart -n agent-triage
#     ==  kustomize build deploy/
#
# So the raw manifests remain the single reviewed description of how the
# sentinel is deployed, and the chart is a parameterization of it rather
# than a second opinion. When you change a manifest, run the parity
# check; it will tell you exactly which chart template drifted.

# -- Image. The default flavor links zero GCP SDKs. Project-tier
# deployments that enable the quota source need the `-gke` flavor:
# set `image.tag: v0.34.0-gke`, or `image.flavor: gke` to append the
# suffix to whatever appVersion the chart ships with.
image:
  repository: ghcr.io/go-steer/lookout
  # Empty means .Chart.AppVersion, which the release cut keeps in step
  # with deploy/51's pin.
  tag: ""
  flavor: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Set false when the ServiceAccount is managed outside the chart —
  # a Workload-Identity-annotated one, say.
  create: true
  name: ""
  annotations: {}

rbac:
  # The cluster-scoped read-only ClusterRole + binding. Turn off for a
  # namespace-tier deployment that binds an equivalent Role per
  # namespace instead (DESIGN §11).
  create: true
  # The kube-system Role that lets the capacity source read
  # `cluster-autoscaler-status`. Independent of the ClusterRole because
  # it is the one grant outside the sentinel's own namespace that a
  # cluster admin may reasonably refuse.
  capacity: true
  # The ClusterRole's cluster-wide `secrets: list` (and the paired
  # `serviceaccounts: list`) — §11's broadest grant, since a Secret list
  # returns values. false drops both rules and appends
  # --enrich-lists=all,-secrets,-serviceaccounts to the watcher (unless
  # `args` already sets --enrich-lists), the same deployment as the
  # deploy-no-secrets/ overlay (#149). Costs the expiry source (it
  # skips itself under --sources=auto) and the Secret/ServiceAccount
  # reference checks in enrichment bundles.
  secrets: true
  # What the sentinel watches: cluster (every namespace, the ClusterRole
  # above) or namespace (#407) — only the namespaces in `namespaces`
  # below. namespace replaces the cluster-wide ClusterRole and its binding
  # with a Role + RoleBinding in each watched namespace and adds
  # --watch-scope=namespace --namespace=<those namespaces> to the watcher:
  # the same deployment as the deploy-namespaced/ overlay. It costs the
  # expiry and compute-class sources; deploy-namespaced/README.md has the
  # table.
  scope: cluster
  # PRIVILEGED, off by default: the one write grant lookout can use,
  # `patch pods/ephemeralcontainers`, for `lookout net probe-from`
  # (issue #539, docs/in-pod-probe-design.md), plus the
  # ValidatingAdmissionPolicy (Kubernetes 1.30+) that limits the grant
  # to adding the digest-pinned lookout probe container — image from
  # image.repository, nothing mounted, restricted security context.
  # true is the same deployment as the deploy-probe/ overlay. Each probe
  # leaves its ephemeral container in the probed pod's spec for that
  # pod's lifetime.
  probeFrom: false
  # With scope=namespace: the namespaces to watch. Empty means the release
  # namespace. Each gets its own Role + RoleBinding, so the chart's user
  # needs rights to create them there.
  namespaces: []
  # With scope=namespace: the one cluster-wide grant of the namespace tier,
  # read access to Nodes and PersistentVolumes. On by default — it keeps
  # object-state, saturation, capacity, topology-drift and storm
  # correlation working, and nodes carry no tenant data. false is the
  # strictly namespaced tier (deploy-namespaced-strict/): no ClusterRole
  # at all, the capacity Role dropped too, and --storm=on becomes
  # --storm=auto; those five are then skipped at startup.
  nodes: true

# -- The optional LeewayPolicy / ClusterLeewayPolicy CRDs, which let an
# operator declare a workload's placement intent instead of letting the
# topology-drift source infer it (docs/leeway-design.md FR-10).
#
# Off by default. The source works fully without them and most clusters will
# never want them; installing cluster-scoped API types is a bigger commitment
# than deploying a watcher, and it should be a decision rather than a side
# effect. Turning this on is equivalent to
# `kubectl apply -f deploy/crds/leewaypolicies.yaml`.
#
# The sentinel evaluates the CRDs' presence once, at startup, so enabling this
# against a running release needs a restart of the watcher pod before policies
# take effect.
#
# The ClusterRole grants list/watch on both kinds either way — the grant is
# inert on a cluster where the CRDs are absent, and carrying it means enabling
# them later is one step rather than two.
leewayPolicyCRD:
  install: false

# -- Sentinel flags. These are the container args, verbatim: the image
# entrypoint is ["/lookout", "watch"], so each entry splices in behind
# `watch`. Setting `args` replaces the list wholesale, which is the
# honest behaviour for a flag set where the interactions matter — see
# the comments in deploy/51-deployment-watcher.yaml before changing one.
#
# The two you will almost certainly change are --daemon-url and
# --cluster-name; --owner is the fallback session owner.
args:
  - "--daemon-url=http://core-agent.agent-triage.svc.cluster.local:7777"
  - "--token-env=WATCHER_TOKEN"
  - "--mode=per-incident"
  - "--owner=sre-oncall@example.com"
  - "--cluster-name=local"
  - "--dedup-window=5m"
  - "--in-cluster"
  - "--metrics-addr=:9090"
  - "--log-level=info"
  - "--storm=on"
  - "--store=/var/lib/lookout/lookout.db"

# -- The bearer token the sentinel presents to the core-agent daemon.
# The chart does NOT create this Secret: a chart that takes a token as
# a value writes it into the release's stored manifest, where anyone
# with get-secret in the namespace can read it back out of the Helm
# release itself. Create it out of band and name it here.
daemonToken:
  secretName: lookout-watch-token
  secretKey: token
  envVar: WATCHER_TOKEN

# -- Replicas. One, and the strategy is Recreate: with a rolling
# update, replicas: 1 still briefly runs two sentinels watching the
# same cluster and double-emitting every signal. Raising this does not
# give you high availability — it gives you duplicate incidents.
# Leader election is tracked separately.
replicaCount: 1

# -- The occurrence store's home (§9.1): info-signal persistence, graph
# history for `--at` post-mortems, triage-status records. emptyDir is
# the zero-friction default because the store is telemetry, never
# control flow — losing it on reschedule costs history, not
# correctness. For durable post-mortems set `persistence.enabled: true`
# and either name an existing claim or let the chart create one. The
# image is distroless, so `kubectl cp` off a live pod does not work; a
# PVC you can mount from a debug pod is the practical way to get the
# store out.
persistence:
  enabled: false
  existingClaim: ""
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# -- The container port /metrics, /healthz and /readyz are served on.
# It must agree with --metrics-addr in `args` above; nothing can check
# that for you, because the flag is an opaque string to the chart.
metricsPort: 9090

service:
  # A ClusterIP Service for /metrics. Needed by anything that scrapes by
  # Service rather than by pod IP, which is every operator-managed
  # Prometheus.
  create: true
  type: ClusterIP
  port: 9090
  annotations: {}
  labels: {}

# -- A prometheus-operator ServiceMonitor. Off by default because it is
# a CRD: rendering it on a cluster without prometheus-operator fails
# the install, and the base bundle has to work everywhere. GKE's
# managed Prometheus wants a PodMonitoring instead — see
# deploy/prometheus-operator/servicemonitor.yaml.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
  metricRelabelings: []

# -- Ingress to :9090 from the release namespace only. If your CNI does
# not enforce NetworkPolicy this is inert, not broken.
networkPolicy:
  create: true
  # Extra `from:` peers, appended to the same-namespace rule. A scraper
  # in another namespace (prometheus in monitoring/, GMP in
  # gmp-system/) needs one:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  extraIngressFrom: []

# Sized from the measured per-object cache cost, not from a round
# number: a trimmed pod is 18,630 B of retained heap on GKE and a node
# 5,308 B, so the top of the 1-15k pod range lookout calls typical is
# ~275 MiB of object cache before anything else allocates. The previous
# 256Mi default ran out at ~14k pods. Operations -> Sizing has the table
# per cluster size, and the levers when the limit is not enough.
resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "768Mi"

# Soft heap ceiling, set to ~80% of resources.limits.memory. Without it
# the Go heap grows until the kernel OOM-kills the process, losing the
# store's in-flight writes and every watch; with it the GC gets
# aggressive first, which is slow but survivable. Raise it with the
# limit — the downward API cannot do the arithmetic, so the two are kept
# in step by hand. Set to "" to leave GOMEMLIMIT unset.
goMemLimit: "600MiB"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
securityContext: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 30

# /readyz, not /healthz: liveness asks whether the process is up,
# readiness asks whether it has established its watches. The sentinel
# is blind until its informers sync, and that is exactly the window a
# rollout must not cut over into.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
commonLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
