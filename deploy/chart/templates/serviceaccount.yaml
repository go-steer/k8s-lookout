{{- if .Values.serviceAccount.create }}
# KSA for the sentinel. Minimum-necessary RBAC — see clusterrole.yaml.
# NOT bound to any cloud IAM identity by default; the sentinel talks
# only to the local API server and to the core-agent daemon over pod
# networking. Workload Identity annotations go in
# `serviceAccount.annotations`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lookout.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookout.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
