{{- if .Values.networkPolicy.create }}
# SOURCE OF TRUTH: deploy/16-networkpolicy-watcher.yaml.
#
# Default-deny ingress. The sentinel is a privileged reader — its
# ServiceAccount can list Secret values cluster-wide — so co-tenant
# pods get no network path to it. Even /metrics is an
# incident-topology map (per-namespace failure-class counters) that a
# co-tenant should not be able to scrape.
#
# Egress is deliberately unrestricted: the sentinel dials the API
# server, the core-agent daemon, and cloud APIs, whose addresses are
# environment-specific. A wrong egress pin fails closed in exactly the
# incidents the sentinel exists to catch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lookout.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookout.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lookout.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        # The CONTAINER port, not the Service port — a NetworkPolicy
        # filters the pod, and the Service's port is only a name for it.
        - protocol: TCP
          port: {{ .Values.metricsPort }}
{{- end }}
