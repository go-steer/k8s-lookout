{{- if and .Values.rbac.create (not (include "lookout.namespaceScope" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lookout.fullname" . }}
  labels:
    {{- include "lookout.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lookout.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lookout.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
