{{- if not (include "lookout.mcpMode" .) }}
{{- $sinkType := include "lookout.sinkType" . -}}
{{- $dryRun := false -}}
{{- $hasSink := false -}}
{{- $hasAXServer := false -}}
{{- $hasAXTemplate := false -}}
{{- $hasAXHTTPRouter := false -}}
{{- $hasAXRouterCredBundle := false -}}
{{- $hasSinkURL := false -}}
{{- $hasSinkTokenEnv := false -}}
{{- $selected := false -}}
{{- range (concat .Values.args .Values.extraArgs) -}}
{{- if eq . "--dry-run" }}{{ $dryRun = true }}{{ end -}}
{{- if hasPrefix "--sink=" . }}{{ $hasSink = true }}{{ end -}}
{{- if hasPrefix "--ax-server=" . }}{{ $hasAXServer = true }}{{ end -}}
{{- if hasPrefix "--ax-task-template=" . }}{{ $hasAXTemplate = true }}{{ end -}}
{{- if hasPrefix "--ax-router-url=http://" . }}{{ $hasAXHTTPRouter = true }}{{ end -}}
{{- if hasPrefix "--ax-router-credential-bundle=" . }}{{ $hasAXRouterCredBundle = true }}{{ end -}}
{{- if hasPrefix "--sink-url=" . }}{{ $hasSinkURL = true }}{{ end -}}
{{- if hasPrefix "--sink-token-env=" . }}{{ $hasSinkTokenEnv = true }}{{ end -}}
{{- if hasPrefix "--enrich-lists" . }}{{ $selected = true }}{{ end -}}
{{- end -}}
{{- if and (eq $sinkType "webhook") (not .Values.sink.webhook.url) (not $hasSinkURL) (not $dryRun) -}}
{{- fail "sink.webhook.url is required when sink.type=webhook (unless --sink-url or --dry-run is set)" -}}
{{- end -}}
{{- if and (eq $sinkType "ax") (not .Values.sink.ax.routerMTLS) (not $hasAXHTTPRouter) (not $hasAXRouterCredBundle) (not $dryRun) -}}
{{- fail "sink.ax.routerMTLS=false omits the router mTLS volumes; pass --ax-router-url=http://... (Substrate v0.5) or --ax-router-credential-bundle= in args/extraArgs, or keep sink.ax.routerMTLS=true" -}}
{{- end -}}
# SOURCE OF TRUTH: deploy/base/51-deployment-watcher.yaml (and
# deploy/components/sink-ax/ when sink.type=ax), held in step by
# dev/tools/verify-helm-parity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lookout.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookout.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lookout.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lookout.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lookout.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: watcher
          image: {{ include "lookout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- $strict := and (include "lookout.namespaceScope" .) (not .Values.rbac.nodes) }}
            {{- $replacedDaemonURL := false }}
            {{- range .Values.args }}
            {{- if and (eq $sinkType "ax") (hasPrefix "--daemon-url=" .) }}
            {{- $replacedDaemonURL = true }}
            - --sink=ax
            {{- else if and (eq $sinkType "webhook") (hasPrefix "--daemon-url=" .) }}
            {{- $replacedDaemonURL = true }}
            - --sink=webhook
            {{- else if and (eq $sinkType "webhook") (or (hasPrefix "--token-env=" .) (hasPrefix "--mode=" .) (hasPrefix "--owner=" .) (hasPrefix "--target-session=" .)) }}
            {{- else if and $strict (eq . "--storm=on") }}
            - --storm=auto
            {{- else }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if and (ne $sinkType "core-agent") (not $replacedDaemonURL) (not $hasSink) }}
            - {{ printf "--sink=%s" $sinkType | quote }}
            {{- end }}
            {{- if eq $sinkType "ax" }}
            {{- if not $hasAXServer }}
            - {{ printf "--ax-server=%s" .Values.sink.ax.server | quote }}
            {{- end }}
            {{- if not $hasAXTemplate }}
            - "--ax-task-template=/etc/lookout/ax/task.yaml"
            {{- end }}
            {{- end }}
            {{- if eq $sinkType "webhook" }}
            {{- if and .Values.sink.webhook.url (not $hasSinkURL) }}
            - {{ printf "--sink-url=%s" .Values.sink.webhook.url | quote }}
            {{- end }}
            {{- if and .Values.sink.webhook.tokenSecretName (not $hasSinkTokenEnv) }}
            - {{ printf "--sink-token-env=%s" .Values.sink.webhook.tokenEnvVar | quote }}
            {{- end }}
            {{- end }}
            {{- if include "lookout.namespaceScope" . }}
            - --watch-scope=namespace
            {{- if .Values.rbac.namespaces }}
            - --namespace={{ join "," .Values.rbac.namespaces }}
            {{- else }}
            - --namespace=$(POD_NAMESPACE)
            {{- end }}
            {{- end }}
            {{- if and (not .Values.rbac.secrets) (not $selected) }}
            - --enrich-lists=all,-secrets,-serviceaccounts
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: lookout-data
              mountPath: /var/lib/lookout
            {{- if eq $sinkType "ax" }}
            - name: ax-task
              mountPath: /etc/lookout/ax
              readOnly: true
            {{- if .Values.sink.ax.routerMTLS }}
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if ne $sinkType "webhook" }}
            - name: {{ .Values.daemonToken.envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.daemonToken.secretName }}
                  key: {{ .Values.daemonToken.secretKey }}
            {{- else if .Values.sink.webhook.tokenSecretName }}
            - name: {{ .Values.sink.webhook.tokenEnvVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sink.webhook.tokenSecretName }}
                  key: {{ .Values.sink.webhook.tokenSecretKey }}
            {{- end }}
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if include "lookout.namespaceScope" . }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: lookout-data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "lookout.fullname" .)) }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if eq $sinkType "ax" }}
        - name: ax-task
          configMap:
            name: {{ include "lookout.axTaskConfigMapName" . }}
        {{- if .Values.sink.ax.routerMTLS }}
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
