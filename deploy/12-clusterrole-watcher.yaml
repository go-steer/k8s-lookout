# Minimum-necessary ClusterRole for the sentinel (`lookout watch`).
# The sentinel only OBSERVES cluster state — never modifies it. All
# mutations happen through the core-agent daemon's MCP tool calls,
# authorized by the daemon's own ServiceAccount.
#
# What the sentinel needs:
#   - list/watch events — the primary informer target
#   - list/watch pods — the recovery clearance observer (DESIGN.md
#                       §7.4): watches bound incidents' pods for
#                       Ready + restart-stable, so fixed incidents
#                       get a kind=resolved inject. Without this
#                       grant the sentinel still runs, but recovery
#                       tracking is disabled (logged loudly).
#   - get pods       — status enrichment for inject payloads (owner
#                       ref, container statuses)
#   - list/watch nodes, deployments, endpointslices,
#     poddisruptionbudgets — the object-state source (DESIGN.md §7.2,
#                       enabled via --sources=k8s-events,object-state):
#                       leading indicators from state transitions.
#                       Harmless when the source is disabled (the
#                       default); required when enabled — the §11
#                       startup probe fails loudly naming the missing
#                       grant. A namespace-scoped deployment (Role,
#                       not ClusterRole) cannot satisfy these and gets
#                       the same loud per-source failure instead of a
#                       silently empty watch.
#   - list/watch replicasets — the storm-correlation topology graph
#                       (DESIGN.md §6.3 + §7.5, enabled via --storm):
#                       a ReplicaSet's ownerReferences extend the
#                       blast-radius owner chain to the Deployment,
#                       the ancestor operators recognize. The graph's
#                       pods/nodes informers ride the grants above
#                       (one shared informer set). Harmless when
#                       --storm is off (the default); required when on
#                       — verified loudly at startup like a source.
#
# What the sentinel deliberately does NOT get:
#   - patch/update/delete on anything — the sentinel is read-only
#   - secrets — the sentinel never reads workload secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-event-watcher
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # Enrichment (§7.6) distills the target pods' logs into the warm
    # bundle attached to the initial inject.
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    # "get" beyond list/watch: the enrichment live path GETs the
    # workload object behind an incident (§7.6) rather than caching
    # every Deployment in the informer set.
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
