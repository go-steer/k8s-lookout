# Kustomize Component scoping `lookout watch` to a list of namespaces
# (by default its own via POD_NAMESPACE) plus read-only node/PV access
# (#407, #852). When combining with `no-secrets`, list `scope-namespaced`
# before `no-secrets` so `no-secrets` narrows `Role/lookout-watch`.
# Helm: `rbac.scope=namespace`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - role-watcher.yaml
  - rolebinding-watcher.yaml
  - clusterrole-watcher-nodes.yaml
  - clusterrolebinding-watcher-nodes.yaml
patches:
  # Fail closed if `no-secrets` was listed BEFORE `scope-namespaced` (or
  # `scope-namespaced-strict`): otherwise `Role/lookout-watch` added here
  # would retain `secrets: list` after `no-secrets` already ran.
  - target:
      kind: ConfigMap
      name: lookout-component-no-secrets
    patch: |-
      - op: test
        path: /data/list-scope-namespaced-before-no-secrets-in-components
        value: "required"
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: lookout-watch
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: lookout-watch
  - target:
      kind: Deployment
      name: lookout-watch
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: watcher
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --watch-scope=namespace
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --namespace=$(POD_NAMESPACE)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
