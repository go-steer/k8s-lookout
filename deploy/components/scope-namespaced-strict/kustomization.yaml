# Kustomize Component for the strictly namespaced tier (#407, #852):
# builds on `scope-namespaced`, drops the node ClusterRole and kube-system
# capacity Role so zero cluster-wide or cross-namespace grants remain, and
# rewrites `--storm=on` to `--storm=auto` by flag match rather than
# positional `args/<N>`. Use instead of `scope-namespaced`, not alongside it.
# Helm: `rbac.scope=namespace` with `rbac.nodes=false`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - local-config.yaml
components:
  - ../scope-namespaced
patches:
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: lookout-watch-nodes
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: lookout-watch-nodes
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: lookout-watch-capacity
        namespace: kube-system
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: lookout-watch-capacity
        namespace: kube-system
replacements:
  - source:
      kind: ConfigMap
      name: lookout-component-scope-strict
      fieldPath: data.storm
    targets:
      - select:
          kind: Deployment
          name: lookout-watch
        fieldPaths:
          - spec.template.spec.containers.[name=watcher].args.[=--storm=on]
