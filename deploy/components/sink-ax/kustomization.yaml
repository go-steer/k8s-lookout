# Kustomize Component switching `lookout watch` to the AX sink
# (docs/ax-sink-design.md) with Substrate v0.6+ router mTLS (#809, #852):
#
#   resources:
#     - github.com/go-steer/k8s-lookout/deploy/base?ref=vX.Y.Z
#   components:
#     - github.com/go-steer/k8s-lookout/deploy/components/sink-ax?ref=vX.Y.Z
#
# Composes cleanly with `no-secrets`, `scope-namespaced`,
# `scope-namespaced-strict`, and `probe-from`. Helm: `sink.type=ax`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - local-config.yaml
configMapGenerator:
  - name: lookout-ax-task
    namespace: agent-triage
    files:
      - task.yaml
patches:
  - target:
      kind: Deployment
      name: lookout-watch
    path: patch-deployment.yaml
  - target:
      kind: Deployment
      name: lookout-watch
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: watcher
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --ax-server=ax-server.ax-system.svc:8080
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --ax-task-template=/etc/lookout/ax/task.yaml
replacements:
  - source:
      kind: ConfigMap
      name: lookout-component-sink-ax
      fieldPath: data.sink
    targets:
      - select:
          kind: Deployment
          name: lookout-watch
        fieldPaths:
          - spec.template.spec.containers.[name=watcher].args.[=--daemon-url=]
