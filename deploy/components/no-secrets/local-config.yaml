# Local-config marker so `scope-namespaced` fails `kustomize build` closed
# if an operator lists `no-secrets` BEFORE `scope-namespaced` (or
# `scope-namespaced-strict`), which would otherwise leave `secrets: list`
# granted on `Role/lookout-watch` (#852).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lookout-component-no-secrets
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  order: scope-before-no-secrets
