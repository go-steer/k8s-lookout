# Kustomize Component dropping `secrets: list` and `serviceaccounts: list`
# from ClusterRole/lookout-watch (and Role/lookout-watch when composed
# after `scope-namespaced` / `scope-namespaced-strict`), plus passing
# `--enrich-lists=all,-secrets,-serviceaccounts` (#149, #852).
# Helm: `rbac.secrets=false`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - local-config.yaml
patches:
  - target:
      kind: ClusterRole
      name: lookout-watch
    path: patch-clusterrole.yaml
  - target:
      kind: Role
      name: lookout-watch
    path: patch-role.yaml
  - target:
      kind: Deployment
      name: lookout-watch
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: watcher
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enrich-lists=all,-secrets,-serviceaccounts
