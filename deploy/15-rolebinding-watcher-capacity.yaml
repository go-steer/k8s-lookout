# Binds the sentinel's ServiceAccount to the kube-system capacity Role
# (14-role-watcher-capacity.yaml). Only needed with
# --sources=…,capacity.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lookout-watch-capacity
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: lookout-watch
    namespace: agent-triage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lookout-watch-capacity
