# Optional Component on deploy/mcp/: generic MCP clients (Claude Code,
# gemini-cli) sign in through lookout's own OAuth authorization server
# (`--oauth-issuer`) while Gemini Enterprise keeps working on the same
# endpoint. Helm: `mode=mcp` with `mcp.oauth.enabled=true`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: lookout-mcp
    path: patch-deployment.yaml
  - target:
      kind: Deployment
      name: lookout-mcp
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: mcp
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--oauth-issuer=https://$(DOMAIN)"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--google-client-secret-file=/etc/lookout/oauth/client/client.json"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--oauth-keys-file=/etc/lookout/oauth/keys/keyring"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--oauth-custody=$(OAUTH_CUSTODY)"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--oauth-vault-auth-provider=$(OAUTH_VAULT_AUTH_PROVIDER)"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--oauth-open-registration"
