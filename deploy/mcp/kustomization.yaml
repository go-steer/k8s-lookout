# Standalone `lookout mcp` Gateway deployment (#699, #852): every tool call
# reads as the signed-in caller with their own Google token, so what they
# see is what their own Kubernetes RBAC and Cloud IAM allow.
#
#   kubectl apply -k "github.com/go-steer/k8s-lookout/deploy/mcp?ref=vX.Y.Z"
#
# Edit config.yaml first (DOMAIN, GOOGLE_CLIENT_ID, GOOGLE_ALLOW), or merge
# it from your own kustomization alongside deploy/mcp/domain (and optional
# deploy/mcp/oauth for generic MCP clients). Helm: `mode=mcp`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - mcp.yaml
  - gateway.yaml

# DOMAIN, set once in config.yaml, is also the route's hostname (domain/).
components:
  - domain
