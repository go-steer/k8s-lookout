# Lets the sentinel deploy without cloning the repo:
#
#   kubectl apply -k "github.com/go-steer/k8s-lookout/deploy?ref=vX.Y.Z"
#
# Prerequisites (the manifests reference but do not create them): the
# agent-triage namespace and the lookout-watch-token Secret — see
# the deploy page on the docs site.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 11-serviceaccount-watcher.yaml
  - 12-clusterrole-watcher.yaml
  - 13-clusterrolebinding-watcher.yaml
  - 14-role-watcher-capacity.yaml
  - 15-rolebinding-watcher-capacity.yaml
  - 16-networkpolicy-watcher.yaml
  - 51-deployment-watcher.yaml
