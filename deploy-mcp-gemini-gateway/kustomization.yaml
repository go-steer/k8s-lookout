# deploy-mcp-gemini behind a GKE Gateway with a Certificate Manager map,
# in place of the Ingress + ManagedCertificate. Same pods, same
# config.yaml (deploy-mcp-gemini/config.yaml); only the load balancer differs.
#
#   kubectl apply -k "github.com/go-steer/k8s-lookout/deploy-mcp-gemini-gateway?ref=vX.Y.Z"
#
# Two names in gateway.yaml are yours to set, as lookout-mcp-ip is on the
# Ingress path: the reserved global static IP (NamedAddress, default
# lookout-mcp-ip) and the Certificate Manager map (the
# networking.gke.io/certmap annotation, default lookout-mcp), which must
# hold a certificate for DOMAIN. The cluster needs the Gateway API
# enabled (Autopilot has it; Standard: --gateway-api=standard).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../deploy-mcp-gemini
  - gateway.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: lookout-mcp
        namespace: agent-triage
  - patch: |-
      $patch: delete
      apiVersion: networking.gke.io/v1
      kind: ManagedCertificate
      metadata:
        name: lookout-mcp
        namespace: agent-triage
  - patch: |-
      $patch: delete
      apiVersion: cloud.google.com/v1
      kind: BackendConfig
      metadata:
        name: lookout-mcp
        namespace: agent-triage
  # The Gateway controller manages the Service's NEGs itself, and the
  # HealthCheckPolicy and GCPBackendPolicy in gateway.yaml replace the
  # BackendConfig.
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: lookout-mcp
        namespace: agent-triage
        annotations:
          cloud.google.com/neg: null
          cloud.google.com/backend-config: null

# DOMAIN, set once in config.yaml, is also the route's hostname.
components:
  - ../deploy-mcp-gemini/domain
